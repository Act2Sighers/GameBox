<style>
/* Layout: one-screen game. Portrait = shop view on top, touch controls below. Landscape = controls float over the side margins. */
:root {
  color-scheme: dark;
  --bg: #17131d;          /* night outside the shop */
  --panel: #241c2c;       /* control deck */
  --ink: #f3e9d6;         /* parchment text */
  --muted: #a99bb4;
  --gold: #e3b341;        /* the hero's hat band */
  --navy: #2b3768;        /* the hero's cape */
  --line: #3b2f47;
  --ng: #e0303c;          /* cannot place */
  --font-ui: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
#view { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative; }
#view.raised { z-index: 6; }
#bag { display: flex; gap: 8px; }
.slot { position: relative; }
/* map focus: the bag is dimmed (the slot the hero holds stays lit) */
#bag.dim .slot:not(.holding)::after { content: ""; position: absolute; inset: -2px; background: rgba(0, 0, 0, .5); pointer-events: none; }
.slot.holding { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 10px color-mix(in srgb, var(--gold) 60%, transparent); }
/* bag focus: the cursor sits on one slot */
.slot.cursor { border-color: var(--gold); }
.slot.cursor::before {
  content: ""; position: absolute; inset: -6px; pointer-events: none;
  background:
    linear-gradient(var(--gold), var(--gold)) top left / 10px 2px, linear-gradient(var(--gold), var(--gold)) top left / 2px 10px,
    linear-gradient(var(--gold), var(--gold)) top right / 10px 2px, linear-gradient(var(--gold), var(--gold)) top right / 2px 10px,
    linear-gradient(var(--gold), var(--gold)) bottom left / 10px 2px, linear-gradient(var(--gold), var(--gold)) bottom left / 2px 10px,
    linear-gradient(var(--gold), var(--gold)) bottom right / 10px 2px, linear-gradient(var(--gold), var(--gold)) bottom right / 2px 10px;
  background-repeat: no-repeat; animation: pulse 1s ease-in-out infinite alternate;
}
@keyframes pulse { from { opacity: .65; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .slot.cursor::before { animation: none; } }
.slot {
  width: 44px; height: 44px; padding: 0; display: grid; place-items: center; cursor: pointer; touch-action: none;
  background: var(--panel); border: 2px solid var(--line); border-radius: 0;
}
.slot.filled { border-color: color-mix(in srgb, var(--gold) 55%, var(--line)); }
.slot img { width: 32px; height: 32px; image-rendering: pixelated; pointer-events: none; }
.slot.lifting img { opacity: .3; }
.slot:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
.shake { animation: shake .3s; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-4px); } 40% { transform: translateX(4px); } 60% { transform: translateX(-3px); } 80% { transform: translateX(2px); } }
#shade { position: absolute; inset: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 55%, transparent); }
#choiceWin { position: fixed; inset: 0; z-index: 8; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 55%, transparent); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.choice-panel { width: min(280px, 100%); background: var(--panel); border: 2px solid var(--gold); box-shadow: 0 0 0 3px var(--bg); padding: 10px; display: grid; gap: 6px; }
.choice-title { color: var(--gold); font-size: 14px; letter-spacing: .1em; padding: 2px 4px 4px; }
.choice { font: inherit; font-size: 16px; text-align: left; padding: 10px 12px 10px 28px; background: var(--line); color: var(--ink); border: 0; cursor: pointer; position: relative; }
.choice::before { content: "▶"; position: absolute; left: 10px; font-size: 11px; top: 50%; transform: translateY(-50%); color: var(--gold); opacity: 0; }
.choice:hover::before, .choice:focus-visible::before { opacity: 1; }
.choice:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
.choice small { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
#outTimer {
  position: absolute; left: 50%; top: 91.6%; transform: translate(-50%, -100%); pointer-events: none;
  background: color-mix(in srgb, var(--bg) 85%, transparent); border: 1px solid var(--gold); color: var(--ink);
  font-size: 12px; padding: 1px 6px; white-space: nowrap; font-variant-numeric: tabular-nums;
}
#chestWin { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; background: color-mix(in srgb, var(--bg) 35%, transparent); }
.chest-panel {
  --cs: min(40px, 8.5vmin);
  background: var(--panel); border: 2px solid var(--gold); box-shadow: 0 0 0 3px var(--bg); padding: 8px 10px 10px; display: grid; gap: 8px;
}
.chest-head { display: flex; justify-content: space-between; align-items: center; color: var(--gold); font-size: 15px; letter-spacing: .1em; }
#chestClose { font: inherit; font-size: 18px; width: 34px; height: 34px; background: var(--line); color: var(--ink); border: 0; cursor: pointer; }
#chestClose:focus-visible { outline: 2px solid var(--ink); }
#chestGrid { display: grid; grid-template-columns: repeat(6, var(--cs)); gap: 4px; }
#chestGrid .slot { width: var(--cs); height: var(--cs); }
#chestGrid .slot img { width: calc(var(--cs) - 8px); height: calc(var(--cs) - 8px); }
.drag-ghost { position: fixed; width: 40px; height: 40px; margin: -20px 0 0 -20px; pointer-events: none; z-index: 30; image-rendering: pixelated; }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
#screen { position: relative; }
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#msg {
  position: absolute; left: 4%; right: 4%; bottom: 3%;
  background: color-mix(in srgb, var(--bg) 88%, transparent); border: 2px solid var(--gold);
  box-shadow: 0 0 0 2px var(--bg); padding: 8px 12px; font-size: 15px; line-height: 1.5;
  transition: opacity .2s; pointer-events: none;
}
#msg small, #info small { display: block; color: var(--muted); font-size: 13px; }
#info {
  position: absolute; left: 4%; right: 4%; bottom: 3%; pointer-events: none; z-index: 1;
  background: color-mix(in srgb, var(--bg) 92%, transparent); border: 2px solid var(--ink); box-shadow: 0 0 0 2px var(--bg);
  padding: 8px 12px; font-size: 15px; line-height: 1.5;
}
.chest-info { min-height: 3em; font-size: 13px; line-height: 1.5; color: var(--ink); border-top: 1px solid var(--line); padding-top: 6px; }
.chest-info small { display: block; color: var(--muted); font-size: 12px; }
#target {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: 10px; padding: 2px 8px; font-size: 13px; white-space: nowrap;
  background: color-mix(in srgb, var(--bg) 80%, transparent); border: 1px solid var(--line); color: var(--gold);
  pointer-events: none;
}
#controls {
  height: 196px; flex: none; position: relative; background: var(--panel); border-top: 2px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#pad { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; }
#padHint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 108px; height: 108px; border-radius: 50%; border: 2px dashed var(--line);
  display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center;
}
#stick { position: absolute; width: 108px; height: 108px; margin: -54px 0 0 -54px; border-radius: 50%;
  border: 2px solid var(--muted); background: color-mix(in srgb, var(--navy) 45%, transparent); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
  background: var(--ink); opacity: .85; }
/* A and B buttons: fixed size and place; long labels shrink instead (fitLabel) */
.pbtn {
  position: absolute; width: 84px; height: 84px; border-radius: 50%; padding: 0; overflow: hidden;
  display: grid; place-items: center; font-family: var(--font-ui); color: var(--ink); cursor: pointer; touch-action: none;
}
.pbtn span { display: inline-block; white-space: nowrap; font-size: 18px; line-height: 1; }
#act { right: max(20px, env(safe-area-inset-right, 0px)); bottom: 34px; border: 3px solid var(--gold); background: var(--navy); }
#carry { right: calc(max(20px, env(safe-area-inset-right, 0px)) + 78px); bottom: 98px; border: 3px solid var(--ink); background: var(--line); }
#act.on, #carry.on { background: var(--gold); color: var(--bg); }
#act.ng, #carry.ng { border-color: var(--ng); color: var(--muted); }
#act.ng.on, #carry.ng.on { background: var(--line); color: var(--muted); }
#act.idle, #carry.idle { background: transparent; border: 2px dashed var(--line); cursor: default; }
.pbtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#keys { position: absolute; left: 8px; right: 8px; bottom: 8px; font-size: 11px; color: var(--muted); text-align: center; }
#hud {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
  font-size: 15px; color: var(--ink); background: color-mix(in srgb, var(--bg) 70%, transparent);
  border: 1px solid var(--line); padding: 4px 10px; pointer-events: none; font-variant-numeric: tabular-nums; z-index: 2;
}
#gear {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: max(8px, env(safe-area-inset-top, 0px));
  width: 44px; height: 44px; display: grid; place-items: center; z-index: 2;
  background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 50%; cursor: pointer;
}
#gear:hover { color: var(--gold); border-color: var(--gold); }
#gear:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#options {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  width: min(360px, 100%); background: var(--panel); border: 2px solid var(--gold); box-shadow: 0 0 0 3px var(--bg);
  padding: 16px 18px 18px; display: grid; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 18px; font-weight: normal; letter-spacing: .1em; color: var(--gold); }
.opt { display: grid; gap: 8px; }
.opt-label { font-size: 15px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--line); }
.seg button {
  font: inherit; font-size: 15px; padding: 10px 0; border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-checked="true"] { background: var(--navy); color: var(--ink); box-shadow: inset 0 -3px 0 var(--gold); }
.seg button:focus-visible, #optClose:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.desc { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.meta { margin: 0; font-size: 12px; line-height: 1.7; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
#optClose { font: inherit; font-size: 15px; padding: 10px; background: var(--line); color: var(--ink); border: 0; cursor: pointer; }
@media (orientation: landscape) {
  #controls { position: absolute; inset: auto 0 0 0; height: 60%; background: none; border: 0; pointer-events: none; }
  #pad { width: 35%; pointer-events: auto; }
  #act, #carry { pointer-events: auto; }
  #padHint, #keys { opacity: .6; }
  #target { top: auto; bottom: 196px; left: auto; right: max(16px, env(safe-area-inset-right, 0px)); }
  #keys { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: auto; top: 56px; bottom: auto; text-align: left; max-width: 22%; }
}
@media (prefers-reduced-motion: reduce) { #msg { transition: none; } }
</style>

  <div id="hud"><span id="clock">1日目 00:00</span></div>
  <button id="gear" type="button" aria-label="オプション">

          <div class="chest-info" id="chestInfo"></div>
        </div>
      </div>
    </div>
  </div>
  <div id="controls">
    <div id="pad"><div id="padHint">ドラッグで<br>移動</div><div id="stick" hidden><div id="knob"></div></div></div>
    <div id="target" hidden></div>

</div>

<div id="choiceWin" hidden>

    <button class="choice" id="choiceCancel" type="button">なんでもない</button>
  </div>
</div>

<div id="options" role="dialog" aria-modal="true" aria-labelledby="optTitle" hidden>
  <div class="sheet">
    <h2 id="optTitle">オプション</h2>
    <div class="opt">
      <div class="opt-label" id="modeLabel">時間の流れ方</div>
      <div class="seg" id="modeSeg" role="radiogroup" aria-labelledby="modeLabel">
        <button type="button" role="radio" data-mode="real" aria-checked="true">リアル</button>
        <button type="button" role="radio" data-mode="game" aria-checked="false">ゲーム</button>
      </div>
      <p class="desc" id="modeDesc"></p>
    </div>
    <p class="meta"><span id="awayInfo"></span><br><span id="saveInfo"></span></p>
    <button id="optClose" type="button">閉じる</button>
  </div>
</div>

// The cauldron: a dark pot-bellied kettle on three legs over embers, with a bubbling brew and steam.
const CAULDRON = (() => {
  const c = layer(2 * T, 2 * T + 10), g = c.getContext("2d");
  const cx = 24, hw = y => {
    let w = 16 + 5 * Math.sin(Math.PI * (y - 17) / 34);
    if (y > 46) w -= (y - 46) * 1.6;
    return Math.round(w);
  };
  for (const [x, w] of [[9, 4], [22, 4], [35, 4]]) box(g, x, 48, w, 9, "#26242e");
  for (let y = 17; y <= 52; y++) { const w = hw(y); rect(g, cx - w - 1, y, 2 * w + 2, 1, PIXEL_OUTLINE); }
  rect(g, cx - hw(52) + 1, 53, 2 * hw(52) - 2, 1, PIXEL_OUTLINE);
  for (let y = 18; y <= 52; y++) {
    const w = hw(y);
    rect(g, cx - w, y, 2 * w, 1, "#2b2935");
    rect(g, cx + w - 4, y, 4, 1, "#1d1b24");
    if (y >= 24 && y <= 42) rect(g, cx - w + 3, y, 3, 1, "#45424f");
    if (y >= 26 && y <= 30) rect(g, cx - w + 4, y, 1, 1, "#66637a");
  }
  rect(g, cx - 16, 44, 32, 1, "#3a3845"); // band
  // rim (top view ellipse) and the dark opening
  const ell = (rx, ry, cy, col) => { for (let dy = -ry; dy <= ry; dy++) { const w = Math.round(rx * Math.sqrt(1 - (dy / (ry + 0.5)) ** 2)); rect(g, cx - w, cy + dy, 2 * w, 1, col); } };
  ell(20, 7, 16, PIXEL_OUTLINE);
  ell(19, 6, 16, "#3d3b49");
  ell(19, 1, 21, "#3d3b49");
  rect(g, cx - 14, 11, 10, 1, "#57546a");
  ell(15, 4, 16, "#15131a");
  return { img: c, cx, cy: 16 };
})();
function drawCauldron(x, y, time) {
  const { cx, cy } = CAULDRON;
  // embers between the legs
  for (let i = 0; i < 7; i++) {
    const f = (Math.sin(time * 9 + i * 1.7) + 1) / 2;
    ctx.fillStyle = f > 0.6 ? "#ffd36a" : f > 0.3 ? "#f08a3a" : "#a8402a";
    ctx.fillRect(x + 14 + i * 3, y + 54 - Math.round(f * 2), 2, 1 + Math.round(f * 2));
  }
  ctx.drawImage(CAULDRON.img, x, y);
  // brew surface
  for (let dy = -3; dy <= 3; dy++) {
    const w = Math.round(14 * Math.sqrt(1 - (dy / 3.6) ** 2));
    ctx.fillStyle = dy <= -2 ? "#2f7a45" : dy >= 2 ? "#3f9655" : "#4aa860";
    ctx.fillRect(x + cx - w, y + cy + dy, 2 * w, 1);
  }
  ctx.fillStyle = "#7fd88a";
  ctx.fillRect(x + cx - 8 + Math.round(Math.sin(time * 1.3) * 3), y + cy - 1, 6, 1);
  // bubbles: grow, pop into a ring, vanish
  for (let i = 0; i < 6; i++) {
    const period = 0.9 + i * 0.23, k = time / period + i * 0.37, cycle = Math.floor(k), p = k - cycle;
    const seed = Math.sin(cycle * 12.9898 + i * 78.233) * 43758.5453;
    const r1 = seed - Math.floor(seed), r2 = (seed * 7.13) - Math.floor(seed * 7.13);
    const bx = x + cx - 11 + Math.round(r1 * 21), by = y + cy - 2 + Math.round(r2 * 4);
    if (p < 0.55) { ctx.fillStyle = "#9ff09a"; ctx.fillRect(bx, by, 1, 1); }
    else if (p < 0.8) { ctx.fillStyle = "#c8ffbe"; ctx.fillRect(bx, by - 1, 2, 2); }
    else if (p < 0.92) { ctx.fillStyle = "#c8ffbe"; ctx.fillRect(bx - 1, by - 1, 1, 1); ctx.fillRect(bx + 2, by - 1, 1, 1); ctx.fillRect(bx, by - 2, 2, 1); }
  }
  // steam
  for (let i = 0; i < 4; i++) {
    const p = (time * 0.45 + i / 4) % 1;
    ctx.globalAlpha = 0.45 * (1 - p);
    ctx.fillStyle = "#e8f0ea";
    ctx.fillRect(x + cx - 9 + i * 6 + Math.round(Math.sin(time * 2 + i) * 2), y + cy - 6 - Math.round(p * 16), 2, 1);
  }
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- time of day: sky, light, room filter
const hex = s => [1, 3, 5].map(i => parseInt(s.slice(i, i + 2), 16));
const smooth = t => t * t * (3 - 2 * t);
// Interpolate keyframes [minute, value] around the 24h circle with eased segments (no visible steps).
function keyed(keys, m, lerp) {
  for (let i = 0; i < keys.length; i++) {
    const [m0, v0] = keys[i], [m1raw, v1] = keys[(i + 1) % keys.length];
    const m1 = i + 1 < keys.length ? m1raw : m1raw + DAY;
    const mm = m < m0 ? m + DAY : m;
    if (mm >= m0 && mm <= m1) return lerp(v0, v1, smooth((mm - m0) / Math.max(1e-6, m1 - m0)));
  }
  return keys[0][1];
}
const lerpNum = (a, b, t) => a + (b - a) * t;
const lerpRGB = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = c => `rgb(${c.map(Math.round).join(",")})`;

const SKY = [ // [minute, [top, horizon]]
  [0, ["#0b1030", "#1a2350"]], [270, ["#0b1030", "#1a2350"]], [330, ["#3a3d75", "#e59a7a"]], [400, ["#7fb2e0", "#f6e2a6"]],
  [480, ["#6fb0e6", "#bfe0f2"]], [960, ["#6fb0e6", "#bfe0f2"]], [1050, ["#5a6fae", "#f29a5c"]], [1110, ["#3a2f63", "#c4607a"]],
  [1170, ["#141a42", "#2a2f5e"]],
].map(([m, cs]) => [m, cs.map(hex)]);
const DAYLIGHT = [[0, 0], [300, 0], [390, 0.75], [480, 1], [960, 1], [1080, 0.55], [1170, 0.05]];
// Room filter: very faint. Premultiplied so the colour never greys out between hues.
const NIGHT = [26, 36, 96], DAWN = [255, 236, 160], DUSK = [255, 112, 60];
const FILTER = [ // [minute, [r, g, b, alpha]]
  [0, [...NIGHT, 0.17]], [210, [...NIGHT, 0.16]], [330, [...DAWN, 0.07]], [400, [...DAWN, 0.06]], [510, [...DAWN, 0]],
  [930, [...DUSK, 0]], [1030, [...DUSK, 0.08]], [1095, [240, 90, 70, 0.09]], [1180, [...NIGHT, 0.12]], [1290, [...NIGHT, 0.15]],
];
function filterAt(m) {
  const pre = keyed(FILTER.map(([k, v]) => [k, [v[0] * v[3], v[1] * v[3], v[2] * v[3], v[3]]]), m, lerpRGB);
  const a = pre[3];
  return a < 0.002 ? null : `rgba(${[0, 1, 2].map(i => Math.round(pre[i] / a)).join(",")},${a.toFixed(3)})`;
}

// Window view: sky gradient, hills, a far cottage, sun/moon and stars.
const WIN = { x: 5 * T + 11, y: 8, w: 38, h: 20 };
const STARS = [[3, 2], [9, 5], [14, 1], [22, 3], [27, 6], [33, 2], [6, 8], [30, 9], [18, 7]];
function hillHeight(x, far) { return far ? 6 + Math.round(2 * Math.sin(x * 0.21 + 1.3) + Math.sin(x * 0.53)) : 3 + Math.round(1.6 * Math.sin(x * 0.31 + 4) + 0.8 * Math.sin(x * 0.9)); }
function drawWindow(m, time) {
  const { x, y, w, h } = WIN;
  const [top, bottom] = keyed(SKY, m, (a, b, t) => [lerpRGB(a[0], b[0], t), lerpRGB(a[1], b[1], t)]);
  const light = keyed(DAYLIGHT, m, lerpNum);
  for (let r = 0; r < h; r++) { ctx.fillStyle = rgb(lerpRGB(top, bottom, r / (h - 1))); ctx.fillRect(x, y + r, w, 1); }
  // stars
  if (light < 0.6) {
    STARS.forEach(([sx, sy], i) => {
      ctx.globalAlpha = (1 - light / 0.6) * (0.55 + 0.45 * Math.sin(time * 1.7 + i * 2.1));
      ctx.fillStyle = "#fff8d8"; ctx.fillRect(x + sx, y + sy, 1, 1);
    });
    ctx.globalAlpha = 1;
  }
  // sun (05:30-18:30) and moon (18:30-05:30) on an arc across the panes
  const arc = (p, color, size) => {
    const px = Math.round(x + 1 + p * (w - 2 - size)), py = Math.round(y + h - 5 - Math.sin(Math.PI * p) * (h - 9));
    ctx.fillStyle = color; ctx.fillRect(px, py + 1, size, size - 2); ctx.fillRect(px + 1, py, size - 2, size);
  };
  if (m >= 330 && m <= 1110) {
    const p = (m - 330) / 780;
    arc(p, rgb(lerpRGB(hex("#ffb060"), hex("#fff3b0"), Math.sin(Math.PI * p))), 4);
  } else {
    const p = mod(m - 1110, DAY) / 660;
    arc(p, "#f1ecd2", 3);
  }
  // hills and a cottage with a lamp at night
  const farCol = lerpRGB(hex("#232c48"), hex("#88a8a0"), light), nearCol = lerpRGB(hex("#161d2c"), hex("#5d8a4e"), light);
  for (let i = 0; i < w; i++) { const hh = hillHeight(i, true); ctx.fillStyle = rgb(farCol); ctx.fillRect(x + i, y + h - hh, 1, hh); }
  const hx = x + 25, hy = y + h - hillHeight(25, true) - 3;
  ctx.fillStyle = rgb(lerpRGB(hex("#2a2030"), hex("#c9b49a"), light)); ctx.fillRect(hx, hy, 5, 3);
  ctx.fillStyle = rgb(lerpRGB(hex("#3a1e22"), hex("#a0483e"), light)); ctx.fillRect(hx - 1, hy - 1, 7, 1); ctx.fillRect(hx, hy - 2, 5, 1);
  if (light < 0.5) { ctx.fillStyle = "#ffd36a"; ctx.fillRect(hx + 2, hy + 1, 1, 1); }
  for (let i = 0; i < w; i++) { const hh = hillHeight(i, false); ctx.fillStyle = rgb(nearCol); ctx.fillRect(x + i, y + h - hh, 1, hh); }
  // frame bars and glass glints over the view
  ctx.fillStyle = C.wallTop; ctx.fillRect(x + 18, y, 2, h); ctx.fillRect(x, y + 9, w, 2);
  ctx.globalAlpha = 0.35; ctx.fillStyle = C.glassHi;
  for (let i = 0; i < 6; i++) ctx.fillRect(x + 3 + i, y + 7 - i, 1, 1);
  for (let i = 0; i < 5; i++) ctx.fillRect(x + 23 + i, y + 19 - i, 1, 1);
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- hero
const HERO_SPR = {};
for (const k of Object.keys(HERO.frames)) HERO_SPR[k] = makeSprite(HERO.frames[k], HERO.palette);
const WALK = ["walk1", "idle", "walk2", "idle"];
const SPEED = 66;            // px per second
const HB = { r: 6, cy: 4 };  // feet: a circle of radius r whose centre is cy px above (x, y), the bottom centre

const hero = { x: 6.5 * T, y: 10 * T + 18, dir: "up", faceRight: true, moving: false, t: 0 };

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function circleHitsTile(x, y, tx, ty) {
  const cx = x, cy = y - HB.cy;
  const nx = clamp(cx, tx * T, tx * T + T), ny = clamp(cy, ty * T, ty * T + T);
  return (cx - nx) ** 2 + (cy - ny) ** 2 < HB.r ** 2;
}
// Move in 1px steps; after each step push the circle out of any solid tile it overlaps.
// Pushing out along the nearest point makes the hero slide off corners and along walls.
function moveHero(dx, dy) {
  const steps = Math.ceil(Math.hypot(dx, dy));
  for (let n = 0; n < steps; n++) {
    hero.x += dx / steps; hero.y += dy / steps;
    for (let pass = 0; pass < 3; pass++) {
      let pushed = false;
      const cy0 = hero.y - HB.cy;
      for (let ty = Math.floor((cy0 - HB.r) / T); ty <= Math.floor((cy0 + HB.r) / T); ty++) {
        for (let tx = Math.floor((hero.x - HB.r) / T); tx <= Math.floor((hero.x + HB.r) / T); tx++) {
          if (!solidAt(tx, ty)) continue;
          const cx = hero.x, cy = hero.y - HB.cy;
          const nx = clamp(cx, tx * T, tx * T + T), ny = clamp(cy, ty * T, ty * T + T);
          let ux = cx - nx, uy = cy - ny, d = Math.hypot(ux, uy);
          if (d >= HB.r) continue;
          if (d < 1e-6) { ux = -dx; uy = -dy; d = Math.hypot(ux, uy) || 1; } // centre inside: back out the way we came
          hero.x += ux / d * (HB.r - d); hero.y += uy / d * (HB.r - d);
          pushed = true;
          if (passageBlocked(tx, ty)) warnPassage();
        }
      }
      if (!pushed) break;
    }
  }
}
function circleFree(x, y) {
  const cy = y - HB.cy;
  for (let ty = Math.floor((cy - HB.r) / T); ty <= Math.floor((cy + HB.r) / T); ty++)
    for (let tx = Math.floor((x - HB.r) / T); tx <= Math.floor((x + HB.r) / T); tx++)
      if (solidAt(tx, ty) && circleHitsTile(x, y, tx, ty)) return false;
  return true;
}
// Walking straight into the edge of an obstacle that is only a few px in the way: step sideways round it.
function walk(dx, dy) {
  const x0 = hero.x, y0 = hero.y, want = Math.hypot(dx, dy);
  moveHero(dx, dy);
  if (!want || Math.hypot(hero.x - x0, hero.y - y0) > want * 0.3) return;
  const ux = dx / want, uy = dy / want;
  if (Math.abs(ux) > 0.25 && Math.abs(uy) > 0.25) return; // diagonal input already slides
  const px = -uy, py = ux;
  for (let side = 1; side <= 12; side++) for (const sg of [1, -1]) {
    if (circleFree(hero.x + px * side * sg + ux * 2, hero.y + py * side * sg + uy * 2)) {
      moveHero(px * sg * Math.min(want, side), py * sg * Math.min(want, side));
      return;
    }
  }
}
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function heroTile() { return [Math.floor(hero.x / T), Math.floor((hero.y - HB.cy) / T)]; }
function cursorTile() { const [tx, ty] = heroTile(), [dx, dy] = DIRS[hero.dir]; return [tx + dx, ty + dy]; }
function currentTarget() { const [cx, cy] = cursorTile(); return targetAt(cx, cy); }

// Can the carried furniture go down on this tile right now?
function canPlaceAt(tx, ty) {
  if (!isFloor(tx, ty, world.room) || furnitureAt(tx, ty) || groundAt(tx, ty) || routeBlocked.has(`${tx},${ty}`)) return false;
  return !circleHitsTile(hero.x, hero.y, tx, ty); // not on top of the hero
}

// ---------------------------------------------------------------- actions
const msg = document.getElementById("msg"), targetChip = document.getElementById("target");
let msgTimer = 0, flash = 0;
function say(line, note) {
  msg.innerHTML = "";
  msg.append(line);
  if (note) { const s = document.createElement("small"); s.textContent = note; msg.append(s); }
  msg.hidden = false; msg.style.opacity = 1; msgTimer = 2.6;
}
// ---- A and B buttons. A = the usual action and anything heading back towards the room;
// B = anything heading from the room towards the bag (picking up, collecting, lifting, going to bed).
function examineTarget(t) {
  flash = 0.25;
  if (t.kind === "chest") openChestWindow(t.furniture);
  else if (t.kind === "entrance") openChoice();
  else say(...ACTIONS[t.kind](t));
}
function buttonSpec() {
  const r = { a: null, b: null };
  if (outing.phase || busy()) return r;
  if (focus === "bag") {
    if (bag[bagCursor] && !held && !world.inBed) r.a = { label: "持つ", fn: holdFromBag };
    return r;
  }
  if (world.inBed) { r.a = { label: "布団から出る", fn: leaveBed }; return r; }
  if (held) {
    const [cx, cy] = cursorTile();
    r.a = { label: "置く", fn: placeFurniture, ng: !canPlaceAt(cx, cy) };
    return r;
  }
  if (heldItem != null) {
    r.a = { label: "置く", fn: putHeldItem };
    r.b = { label: "しまう", fn: stowItem };
    return r;
  }
  const t = currentTarget();
  if (!t) return r;
  r.a = { label: t.kind === "chest" ? "開く" : "調べる", fn: () => examineTarget(t) };
  if (t.ground) r.b = { label: "拾う", fn: () => pickUp(t.ground) };
  const f = t.furniture;
  if (f?.item) r.b = { label: "回収する", fn: () => collect(f) };
  else if (f && isMovable(f)) r.b = { label: "動かす", fn: () => lift(f) };
  else if (f && typeOf(f).kind === "bed") r.b = { label: "布団に入る", fn: enterBed };
  return r;

  if (!c?.use) return;
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const doc = db.doc(`data/users/${id}/save`);
    const snap = await Promise.race([doc.get(), new Promise(r => setTimeout(() => r(null), 10000))]);
    cloud.doc = doc;
    const s = snap?.exists ? snap.data() : null;
    // another device saved more recently than what this one started from: continue from that
    if (s && [1, 2, 3, 4].includes(s.v) && (s.savedAt || 0) > (startedFrom?.savedAt || 0)) applySave(structuredClone(s));
    saveSoon(true);
  } catch (e) { /* stay on device-only saving */ }
}

// ---------------------------------------------------------------- loop
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
canvas.width = W; canvas.height = H; ctx.imageSmoothingEnabled = false;
const BGS = { shop: drawBackground("shop"), workshop: drawBackground("workshop") }, COUNTER = makeCounter();
const clockEl = document.getElementById("clock");

const infoEl = document.getElementById("info");
let lastUi = "";
function updateUi() {
  const spec = buttonSpec();
  const t = held || world.inBed || outing.phase || focus === "bag" ? null : currentTarget();
  const chip = outing.phase ? "薬草取りに出かけている" : world.inBed ? (world.mode === "game" ? "眠っている（時間が早く進んでいる）" : "眠っている")
    : focus === "bag" ? ""
    : held ? `${heldLabel(held)}を運んでいる` : heldItem != null && bag[heldItem] ? `${itemName(bag[heldItem])}を手に持っている` : t ? `▶ ${t.name}` : "";
  const m = tod();
  const clock = `${Math.floor(world.clock / DAY) + 1}日目 ${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}　${ROOMS[world.room].name}`;
  // bag focus: what the cursor is on, shown for as long as it stays there
  const it = focus === "bag" && !busy() ? bag[bagCursor] : undefined;
  const info = it === undefined ? "" : it ? `${itemName(it)}\n${ITEM_TYPES[it.type].note}` : "（空き）";
  const key = `${spec.a?.label}|${spec.a?.ng}|${spec.b?.label}|${chip}|${clock}|${info}`;
  if (key === lastUi) return;
  lastUi = key;
  setButton(act, spec.a); setButton(ctxBtn, spec.b);
  targetChip.textContent = chip; targetChip.hidden = !chip;
  clockEl.textContent = clock;
  infoEl.hidden = !info;
  if (info) {
    infoEl.innerHTML = "";
    if (it) { infoEl.append(`[${itemName(it)}]`); const n = document.createElement("small"); n.textContent = ITEM_TYPES[it.type].note; infoEl.append(n); }
    else infoEl.append("（空き）");
    msg.hidden = true; msgTimer = 0;
  }
}

function update(dt) {
  tickTime(dt);
  if (outing.phase) { updateOuting(dt); updateOutTimer(); finishFrame(dt); return; }
  updateOutTimer();
  const v = inputVector();
  const mag = Math.hypot(v.x, v.y);
  hero.moving = mag > 0.01;
  if (hero.moving && focus === "bag") setFocus("map");
  if (hero.moving) {
    if (Math.abs(v.x) > Math.abs(v.y)) hero.dir = v.x > 0 ? "right" : "left";
    else hero.dir = v.y > 0 ? "down" : "up";
    if (Math.abs(v.x) > 0.3) hero.faceRight = v.x > 0;
    walk(v.x * SPEED * dt, v.y * SPEED * dt);
    hero.t += dt;
    const [tx, ty] = heroTile();
    if (tileAt(tx, ty) === "P") enterRoom(ROOMS[world.room].other, ty);
  } else hero.t = 0;
  finishFrame(dt);
}
const outTimerEl = document.getElementById("outTimer");
function updateOutTimer() {
  const show = outing.phase === "away" && world.room === "shop";
  outTimerEl.hidden = !show;
  if (show) {
    const text = `あと${Math.max(0, Math.ceil((outing.endsAt - Date.now()) / 1000))}秒`;
    if (outTimerEl.textContent !== text) outTimerEl.textContent = text;
  }
}
function finishFrame(dt) {
  if (fade > 0) fade = Math.max(0, fade - dt * 4);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0.3) msg.style.opacity = Math.max(0, msgTimer / 0.3); if (msgTimer <= 0) msg.hidden = true; }
  if (flash > 0) flash -= dt;
  updateUi();
}

function drawHero() {
  const step = hero.moving ? WALK[Math.floor(hero.t / 0.14) % 4] : "idle";
  const bob = step === "idle" ? 0 : 1;
  const spr = HERO_SPR[(held ? "carry_" : "") + step][hero.faceRight ? "right" : "left"];
  const x = Math.round(hero.x), y = Math.round(hero.y);
  ctx.fillStyle = "rgba(29,24,38,0.35)";
  ctx.fillRect(x - 6, y - 2, 12, 2); ctx.fillRect(x - 4, y - 3, 8, 4);
  const sy = y - 23 - bob;
  ctx.drawImage(spr, x - 12, sy);
  // carried furniture rests on the raised hands, above the hat
  if (held) ctx.drawImage(FURNITURE_ART[held.type].img, x - 12, sy + 4 - FURNITURE_ART[held.type].img.height);
  // an item from the bag is hugged in front of the body, both hands round it
  if (heldItem != null && bag[heldItem]) {
    const ix = x - 8 + (hero.faceRight ? 1 : -1), iy = sy + 12; // below the eyes
    ctx.drawImage(ITEM_SPR[bag[heldItem].type], ix, iy);
    for (const hx of [ix + 1, ix + 13]) {
      ctx.fillStyle = PIXEL_OUTLINE; ctx.fillRect(hx - 1, iy + 5, 4, 4);
      ctx.fillStyle = HERO.palette.S; ctx.fillRect(hx, iy + 6, 2, 2);
    }
  }
}

function drawNoPlaceZone() {
  ctx.fillStyle = C.ng;
  ctx.globalAlpha = 0.28;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    const c = tileAt(tx, ty);
    if (c === "P" || (c === "." && !furnitureAt(tx, ty) && routeBlocked.has(`${tx},${ty}`))) ctx.fillRect(tx * T, ty * T, T, T);
  }
  ctx.globalAlpha = 1;
}

let cursorKey = "", cursorMovedAt = 0;
function drawCursor(time) {
  if (world.inBed || outing.phase || focus === "bag") { cursorKey = ""; return; }
  const [cx, cy] = cursorTile();
  const ckey = `${world.room}:${cx},${cy}`, now = performance.now();
  if (ckey !== cursorKey || flash > 0) { cursorKey = ckey; cursorMovedAt = now; }
  const idle = (now - cursorMovedAt) / 1000 - 2.5;
  const fadeMul = idle <= 0 ? 1 : 1 - 0.85 * smooth(Math.min(1, idle / 0.35)); // down to 15%, quickly but smoothly
  const x = cx * T, y = cy * T;
  const pulse = (Math.sin(time * 6) + 1) / 2;
  let col, alpha, fill = null;
  if (held) {
    const ok = canPlaceAt(cx, cy);
    if (ok) { // ghost of the furniture where it would land
      const art = FURNITURE_ART[held.type];
      ctx.globalAlpha = 0.45 * fadeMul; ctx.drawImage(art.img, x, y - art.rise); ctx.globalAlpha = 1;
    }
    col = ok ? C.gold : C.ng; alpha = 0.8 + 0.2 * pulse; fill = ok ? null : C.ng;
  } else {
    const has = !!targetAt(cx, cy);
    col = has ? C.gold : "#f3e9d6"; alpha = has ? 0.75 + 0.25 * pulse : 0.45; fill = has ? C.gold : null;
  }
  if (flash > 0) col = "#ffffff";
  ctx.globalAlpha = alpha * fadeMul;
  // corner brackets: dark backing one pixel inside, then the colour line
  const L = 6, E = T - 1;
  const corners = [[x, y, 1, 1], [x + E, y, -1, 1], [x, y + E, 1, -1], [x + E, y + E, -1, -1]];
  for (const [px, py, sx, sy] of corners) {
    for (const [c, inset] of [[PIXEL_OUTLINE, 1], [col, 0]]) {
      ctx.fillStyle = c;
      const ox = px + sx * inset, oy = py + sy * inset;
      ctx.fillRect(sx > 0 ? ox : ox - L + 1, oy, L, 1);
      ctx.fillRect(ox, sy > 0 ? oy : oy - L + 1, 1, L);
    }
  }
  if (fill) { ctx.globalAlpha = (0.12 + 0.1 * pulse) * fadeMul; ctx.fillStyle = fill; ctx.fillRect(x + 1, y + 1, T - 2, T - 2); }
  ctx.globalAlpha = 1;
}

function render(time) {
  const m = tod();
  ctx.drawImage(BGS[world.room], 0, 0);
  drawWindow(m, time);
  if (held) drawNoPlaceZone();
  const list = [];
  if (COUNTER.room === world.room) list.push({ b: COUNTER.bottom, draw: () => ctx.drawImage(COUNTER.img, COUNTER.x, COUNTER.y) });
  for (const f of furniture) {
    if (f.held || f.room !== world.room) continue;
    const art = FURNITURE_ART[f.type], x = f.tx * T, y = f.ty * T - art.rise;
    const draw = f.type === "cauldron" ? () => drawCauldron(x, y, time) : () => {
      ctx.drawImage(furnitureImage(f), x, y);
      if (f.item) ctx.drawImage(ITEM_SPR[f.item.type], x + 4, y + ITEM_SEAT[f.type]);
    };
    list.push({ b: (f.ty + typeOf(f).h) * T, draw });
  }
  for (const g of ground) {
    if (g.room !== world.room) continue;
    const onCounter = tileAt(g.tx, g.ty) === "K";
    const x = g.tx * T + 4, y = onCounter ? g.ty * T - 8 : g.ty * T + T - 18;
    list.push({ b: onCounter ? COUNTER.bottom + 0.5 : g.ty * T + T - 6.5, draw: () => ctx.drawImage(ITEM_SPR[g.item.type], x, y) });
  }
  if (!world.inBed && outing.phase !== "away") list.push({ b: hero.y, draw: drawHero });
  list.sort((a, b) => a.b - b.b).forEach(o => o.draw());
  const tint = filterAt(m);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
  drawCursor(time);
  if (focus === "bag") { ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(0, 0, W, H); }
  if (fade > 0) { ctx.fillStyle = `rgba(18,14,20,${fade.toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- sizing
const view = document.getElementById("view"), screenEl = document.getElementById("screen");
function fit() {
  const r = view.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const s = Math.min(r.width / W, (r.height - bagEl.offsetHeight - 8) / H) * dpr;
  // integer device pixels keep every dot the same size; fall back to a fractional scale when that would waste >10% of the space
  const css = (s >= 1 && Math.floor(s) / s >= 0.9 ? Math.floor(s) : s) / dpr;
  screenEl.style.width = W * css + "px"; screenEl.style.height = H * css + "px";
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe(view);

function start(hot) {
  const local = loadLocal();
  const from = hot && hot.v ? hot : local;
  if (!applySave(from)) { world.clock = realTOD(); lastRealMs = Date.now(); } // new game: day 1 at the current time
  renderBag();
  fit();
  requestAnimationFrame(frame);
  connectCloud(from);
}
window.claude?.hot?.snapshot?.(() => serialize());
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
