<style>
/* Layout: one-screen game. Portrait = shop view on top, touch controls below. Landscape = controls float over the side margins. */
:root {
  color-scheme: dark;
  --bg: #17131d;          /* night outside the shop */
  --panel: #241c2c;       /* control deck */
  --ink: #f3e9d6;         /* parchment text */
  --muted: #a99bb4;
  --gold: #e3b341;        /* the hero's hat band */
  --navy: #2b3768;        /* the hero's cape */
  --line: #3b2f47;
  --font-ui: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
#view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#screen { position: relative; }
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#msg {
  position: absolute; left: 4%; right: 4%; bottom: 3%;
  background: color-mix(in srgb, var(--bg) 88%, transparent); border: 2px solid var(--gold);
  box-shadow: 0 0 0 2px var(--bg); padding: 8px 12px; font-size: 15px; line-height: 1.5;
  transition: opacity .2s; pointer-events: none;
}
#msg small { display: block; color: var(--muted); font-size: 13px; }
#target {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 12px; padding: 2px 8px; font-size: 13px; white-space: nowrap;
  background: color-mix(in srgb, var(--bg) 80%, transparent); border: 1px solid var(--line); color: var(--gold);
  pointer-events: none;
}
#controls {
  height: 196px; flex: none; position: relative; background: var(--panel); border-top: 2px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#pad { position: absolute; left: 0; top: 0; bottom: 0; width: 60%; }
#padHint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 108px; height: 108px; border-radius: 50%; border: 2px dashed var(--line);
  display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center;
}
#stick { position: absolute; width: 108px; height: 108px; margin: -54px 0 0 -54px; border-radius: 50%;
  border: 2px solid var(--muted); background: color-mix(in srgb, var(--navy) 45%, transparent); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
  background: var(--ink); opacity: .85; }
#act {
  position: absolute; right: max(28px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--gold); background: var(--navy);
  color: var(--ink); font-family: var(--font-ui); font-size: 18px; cursor: pointer; touch-action: none;
}
#act:active, #act.on { background: var(--gold); color: var(--bg); }
#act:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#keys { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }
@media (orientation: landscape) {
  #controls { position: absolute; inset: auto 0 0 0; height: 60%; background: none; border: 0; pointer-events: none; }
  #pad { width: 35%; pointer-events: auto; }
  #act { pointer-events: auto; }
  #padHint, #keys { opacity: .6; }
  #target { top: auto; bottom: calc(50% + 64px); right: max(16px, env(safe-area-inset-right, 0px)); }
  #keys { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); top: 12px; bottom: auto; transform: none; white-space: normal; max-width: 22%; }
}
@media (prefers-reduced-motion: reduce) { #msg { transition: none; } }
</style>

<div id="stage">

</div>

<script>
// ---------------------------------------------------------------- sprite data (generated by art/build.py)
// BEGIN GENERATED: hero
const HERO = {"palette":{"H":"#8a4a2b","h":"#62311c","j":"#b06a40","S":"#f7dcc6","E":"#3a2418","e":"#7a4a32","C":"#2b3768","c":"#1f2850","R":"#e3b341","D":"#8a3d5c","d":"#6a2d47","K":"#5a3a2e"},"frames":{"idle":["........................","....cCC.................",".....cCCCC..............",".......cCCCCC...........",".......cCCCCCCCC........",".......RRRRRRRRRR.......","..cCCCCCCCCCCCCCCCCCCC..","...hhhhhhhhhhhhhhhhhhh..","...HHHHHHHHHHHHHHHHHHH..","...HHHHHHHHHSHHHHHSHHH..","...HHHHHHHSSEESSSSEESH..","...HHHHHHHSSEESSSSEESH..","...HHHHHHHSSeeSSSSeeSH..","...HHHHHHHHSSSSSSSSSH...","...hHHHHHHHHSSSSSSS.....","....hhhhhCCCRCCCC.......","....hhhhCCCCDDDCCCC.....",".....hhcCCCCDDDCCCCC....","......ccCCCSDDDSCCCCC...",".......DDDDDDDDDDDD.....","......DDdDDdDDdDDDD.....",".........SS...SS........",".........KKK..KKK.......","........................"],
"walk1":["........................","....cCC.................",".....cCCCC..............",".......cCCCCC...........",".......cCCCCCCCC........",".......RRRRRRRRRR.......","..cCCCCCCCCCCCCCCCCCCC..","...hhhhhhhhhhhhhhhhhhh..","...HHHHHHHHHHHHHHHHHHH..","...HHHHHHHHHSHHHHHSHHH..","...HHHHHHHSSEESSSSEESH..","...HHHHHHHSSEESSSSEESH..","...HHHHHHHSSeeSSSSeeSH..","...HHHHHHHHSSSSSSSSSH...","...hHHHHHHHHSSSSSSS.....","....hhhhhCCCRCCCC.......","....hhhhCCCCDDDCCCC.....",".....hhcCCCCDDDCCCCC....","......ccCCCSDDDSCCCCC...",".......DDDDDDDDDDDD.....","......DDdDDdDDdDDDD.....",".........KKK..SS........","..............KKK.......","........................"],
"walk2":["........................","....cCC.................",".....cCCCC..............",".......cCCCCC...........",".......cCCCCCCCC........",".......RRRRRRRRRR.......","..cCCCCCCCCCCCCCCCCCCC..","...hhhhhhhhhhhhhhhhhhh..","...HHHHHHHHHHHHHHHHHHH..","...HHHHHHHHHSHHHHHSHHH..","...HHHHHHHSSEESSSSEESH..","...HHHHHHHSSEESSSSEESH..","...HHHHHHHSSeeSSSSeeSH..","...HHHHHHHHSSSSSSSSSH...","...hHHHHHHHHSSSSSSS.....","....hhhhhCCCRCCCC.......","....hhhhCCCCDDDCCCC.....",".....hhcCCCCDDDCCCCC....","......ccCCCSDDDSCCCCC...",".......DDDDDDDDDDDD.....","......DDdDDdDDdDDDD.....",".........SS...KKK.......",".........KKK............","........................"]}};
// END GENERATED: hero

// ---------------------------------------------------------------- pixel helpers (docs/pixel-art/tools/sprite.js)
const PIXEL_OUTLINE = "#1d1826";
function makeSprite(grid, palette, outlineColor = PIXEL_OUTLINE) {
  const h = grid.length, w = grid[0].length;
  const filled = (x, y) => x >= 0 && y >= 0 && x < w && y < h && grid[y][x] !== ".";
  const right = document.createElement("canvas");
  right.width = w; right.height = h;
  const ctx = right.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = grid[y][x];
      let color = null;
      if (ch !== ".") {
        color = palette[ch];
        if (!color) throw new Error(`unknown char ${ch} at ${x},${y}`);
      } else if (filled(x + 1, y) || filled(x - 1, y) || filled(x, y + 1) || filled(x, y - 1)) {
        color = outlineColor;
      }
      if (color) { ctx.fillStyle = color; ctx.fillRect(x, y, 1, 1); }
    }
  }
  const left = document.createElement("canvas");
  left.width = w; left.height = h;
  const lctx = left.getContext("2d");
  lctx.translate(w, 0); lctx.scale(-1, 1); lctx.drawImage(right, 0, 0);
  return { right, left };
}
function layer(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function rect(g, x, y, w, h, color) { g.fillStyle = color; g.fillRect(x, y, w, h); }
function box(g, x, y, w, h, fill, line = PIXEL_OUTLINE) { rect(g, x, y, w, h, line); rect(g, x + 1, y + 1, w - 2, h - 2, fill); }

// ---------------------------------------------------------------- map
// # wall  D workshop door  E entrance  S wall shelf  T display table (shelf)  K counter  B counter with checkout board
const T = 24;
const MAP = [
  "#############",
  "#########D###",
  "#SSSS.......#",
  "#.......K...#",
  "#.......KKBK#",
  "#...........#",
  "#.TTTT......#",
  "#.TTTT......#",
  "#...........#",
  "#...........#",
  "#...........#",
  "######E######",
];
const COLS = MAP[0].length, ROWS = MAP.length, W = COLS * T, H = ROWS * T;
const SOLID = new Set(["#", "D", "E", "S", "T", "K", "B"]);
const tileAt = (tx, ty) => (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) ? "#" : MAP[ty][tx];

// Interactable things, keyed by "x,y". Shelves are numbered 1-12.
const TARGETS = new Map();
(function buildTargets() {
  let n = 0;
  const shelf = (x, y) => TARGETS.set(`${x},${y}`, { kind: "shelf", no: ++n, name: `商品棚 ${n}` });
  for (let x = 1; x <= 4; x++) shelf(x, 2);
  for (let x = 2; x <= 5; x++) shelf(x, 6);
  for (let x = 2; x <= 5; x++) shelf(x, 7);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = MAP[y][x];
    if (c === "B") TARGETS.set(`${x},${y}`, { kind: "board", name: "会計ボード" });
    if (c === "D") TARGETS.set(`${x},${y}`, { kind: "workshop", name: "工房へのドア" });
    if (c === "E") TARGETS.set(`${x},${y}`, { kind: "entrance", name: "玄関のドア" });
  }
})();

// Placeholder handlers: later rounds fill these in.
const ACTIONS = {
  shelf: t => [`${t.name}を調べた。`, "（まだ商品は並んでいない）"],
  board: t => [`${t.name}を調べた。`, "（会計はまだできない）"],
  workshop: t => [`${t.name}を調べた。`, "（工房にはまだ入れない）"],
  entrance: t => [`${t.name}を調べた。`, "（まだお客さんは来ない）"],
};

// ---------------------------------------------------------------- shop art (drawn at 1x)
const C = {
  floorA: "#a87b4f", floorB: "#a07349", floorLine: "#86603c",
  wallTop: "#3b2a22", wallEdge: "#5a4030", plaster: "#cdb894", plasterShade: "#b9a27e",
  wood: "#7a4e2e", woodDark: "#5e3b22", woodDeep: "#3e2618", woodLight: "#9a6a40", woodTop: "#b78550", woodTopEdge: "#cf9d63",
  glass: "#9fc4d8", glassHi: "#d6ecf5", gold: "#e3b341", velvet: "#5b4479", velvetHi: "#7a62a0",
  slate: "#2f3b36", chalk: "#d9e3dc", rug: "#7a3d4a", rugHi: "#a85a64",
};

function drawBackground() {
  const c = layer(W, H), g = c.getContext("2d");
  // floor planks: 6px rows with staggered joints
  for (let y = 0; y < H; y += 6) {
    const r = y / 6;
    rect(g, 0, y, W, 6, r % 2 ? C.floorA : C.floorB);
    rect(g, 0, y, W, 1, C.floorLine);
    for (let x = (r * 37) % 48; x < W; x += 48) rect(g, x, y, 1, 6, C.floorLine);
  }
  // back wall (rows 0-1): trim, plaster, wainscot, baseboard
  rect(g, 0, 0, W, 2 * T, C.plaster);
  for (let x = 0; x < W; x += 8) rect(g, x, 4, 1, 26, C.plasterShade);
  rect(g, 0, 0, W, 4, C.wallTop);
  rect(g, 0, 30, W, 18, C.wood);
  rect(g, 0, 30, W, 1, C.woodLight);
  for (let x = 6; x < W; x += 24) { rect(g, x, 33, 12, 1, C.woodDark); rect(g, x, 33, 1, 10, C.woodDark); rect(g, x, 43, 13, 1, C.woodLight); rect(g, x + 12, 33, 1, 11, C.woodLight); }
  rect(g, 0, 44, W, 4, C.woodDeep);
  // window between shelves and door
  const wx = 5 * T + 10, wy = 7;
  box(g, wx, wy, 40, 22, C.glass, C.wallTop);
  rect(g, wx + 19, wy + 1, 2, 20, C.wallTop); rect(g, wx + 1, wy + 10, 38, 2, C.wallTop);
  for (let i = 0; i < 6; i++) rect(g, wx + 4 + i, wy + 8 - i, 1, 1, C.glassHi);
  for (let i = 0; i < 5; i++) rect(g, wx + 24 + i, wy + 20 - i, 1, 1, C.glassHi);
  rect(g, wx - 2, wy + 22, 44, 3, C.woodDark);
  // workshop door (D)
  MAP.forEach((row, ty) => [...row].forEach((ch, tx) => {
    if (ch !== "D") return;
    const x = tx * T + 3, y = 12;
    rect(g, x - 1, y - 1, 20, 37, C.wallTop);
    rect(g, x + 2, y - 3, 14, 3, C.wallTop);
    rect(g, x, y, 18, 36, C.wood);
    rect(g, x + 3, y - 2, 12, 2, C.wood);
    rect(g, x + 3, y + 4, 5, 12, C.woodDark); rect(g, x + 10, y + 4, 5, 12, C.woodDark);
    rect(g, x + 3, y + 19, 5, 12, C.woodDark); rect(g, x + 10, y + 19, 5, 12, C.woodDark);
    rect(g, x + 14, y + 17, 2, 2, C.gold);
    rect(g, x + 4, y - 9, 10, 5, C.woodDeep); rect(g, x + 6, y - 8, 6, 1, C.gold); rect(g, x + 7, y - 6, 4, 1, C.gold);
  }));
  // side and front walls (seen from above)
  const wallTile = (tx, ty) => {
    rect(g, tx * T, ty * T, T, T, C.wallTop);
    const inner = (dx, dy) => tileAt(tx + dx, ty + dy) !== "#";
    if (inner(1, 0)) rect(g, tx * T + T - 3, ty * T, 3, T, C.wallEdge);
    if (inner(-1, 0)) rect(g, tx * T, ty * T, 3, T, C.wallEdge);
    if (inner(0, -1)) rect(g, tx * T, ty * T, T, 3, C.wallEdge);
  };
  for (let ty = 2; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) if (MAP[ty][tx] === "#") wallTile(tx, ty);
  for (let ty = 0; ty < 2; ty++) { wallTile(0, ty); wallTile(COLS - 1, ty); }
  // entrance (E): double door seen from above + rug inside
  MAP.forEach((row, ty) => [...row].forEach((ch, tx) => {
    if (ch !== "E") return;
    const x = tx * T, y = ty * T;
    rect(g, x, y, T, T, C.wallTop);
    rect(g, x + 1, y, 22, 14, C.woodDeep);
    rect(g, x + 2, y + 1, 9, 12, C.woodLight); rect(g, x + 13, y + 1, 9, 12, C.woodLight);
    rect(g, x + 3, y + 3, 7, 5, C.glass); rect(g, x + 14, y + 3, 7, 5, C.glass);
    rect(g, x + 9, y + 9, 1, 2, C.gold); rect(g, x + 14, y + 9, 1, 2, C.gold);
    const ry = y - T + 6;
    box(g, x + 1, ry, 22, 14, C.rug, C.woodDeep);
    rect(g, x + 3, ry + 2, 18, 1, C.rugHi); rect(g, x + 3, ry + 11, 18, 1, C.rugHi);
  }));
  return c;
}

// Props are drawn after the floor and depth-sorted against the hero by their bottom edge.
function makeProps() {
  const props = [];
  // wall shelves: tall cabinets, one display niche each
  for (let tx = 1; tx <= 4; tx++) {
    const c = layer(T, 46), g = c.getContext("2d");
    box(g, 0, 0, T, 46, C.wood);
    rect(g, 1, 1, T - 2, 4, C.woodLight);
    rect(g, 1, 5, T - 2, 1, C.woodDark);
    box(g, 3, 8, 18, 24, C.woodDeep, C.woodDark);
    rect(g, 4, 28, 16, 3, C.woodLight); rect(g, 4, 31, 16, 1, C.woodDark);
    box(g, 3, 34, 18, 9, C.wood, C.woodDark); rect(g, 11, 37, 2, 2, C.gold);
    props.push({ img: c, x: tx * T, y: 2 * T + T - 46, bottom: 3 * T });
  }
  // display tables (back-to-back, 4x2): velvet mats mark each slot
  for (const row of [6, 7]) {
    const top = row === 6 ? 4 : 0, face = row === 7 ? 6 : 0;
    const c = layer(4 * T, T + top), g = c.getContext("2d");
    rect(g, 0, 0, 4 * T, T + top, PIXEL_OUTLINE);
    rect(g, 1, row === 6 ? 1 : 0, 4 * T - 2, T + top - (row === 7 ? 1 : 0) - (row === 6 ? 1 : 0), C.woodTop);
    if (row === 6) rect(g, 1, 1, 4 * T - 2, 1, C.woodTopEdge);
    if (row === 7) { rect(g, 1, T - face, 4 * T - 2, face - 1, C.woodDark); rect(g, 1, T - face, 4 * T - 2, 1, C.woodDeep); }
    for (let i = 0; i < 4; i++) {
      const mx = i * T + 4, my = top + (row === 6 ? 4 : 2);
      box(g, mx, my, 16, 14, C.velvet, C.woodDark);
      rect(g, mx + 1, my + 1, 14, 1, C.velvetHi);
    }
    if (row === 6) rect(g, 1, T + top - 1, 4 * T - 2, 1, C.woodLight);
    props.push({ img: c, x: 2 * T, y: row * T - top, bottom: (row + 1) * T });
  }
  // counter (L shape: (8,3) + (8..11,4)) with the checkout board on (10,4)
  {
    const up = 6, cx = 8 * T, cy = 3 * T - up;
    const c = layer(4 * T, 2 * T + up), g = c.getContext("2d");
    const face = 8;
    rect(g, 0, 0, T, 2 * T + up, PIXEL_OUTLINE);
    rect(g, 0, T + up - up, 4 * T, T + up, PIXEL_OUTLINE);
    rect(g, 1, 1, T - 2, 2 * T + up - face - 1, C.wood);
    rect(g, 1, T + 1, 4 * T - 2, T + up - face - 2, C.wood);
    rect(g, 1, 1, T - 2, 1, C.woodLight); rect(g, T - 1, T + 1, 3 * T, 1, C.woodLight);
    rect(g, 1, 2 * T + up - face, 4 * T - 2, face - 1, C.woodDark);
    rect(g, 1, 2 * T + up - face, 4 * T - 2, 1, C.woodDeep);
    for (let x = 8; x < 4 * T; x += 16) rect(g, x, 2 * T + up - face + 2, 1, face - 3, C.woodDeep);
    // checkout board: small slate on a stand
    const bx = 2 * T + 4, by = T + 1;
    box(g, bx, by, 16, 12, C.slate, C.woodDeep);
    rect(g, bx + 1, by + 1, 14, 1, C.gold);
    rect(g, bx + 3, by + 4, 6, 1, C.chalk); rect(g, bx + 3, by + 7, 9, 1, C.chalk); rect(g, bx + 10, by + 4, 3, 1, C.chalk);
    rect(g, bx + 6, by + 12, 4, 2, C.woodDeep);
    // a small bell beside it
    rect(g, bx + 19, by + 7, 5, 4, C.gold); rect(g, bx + 21, by + 5, 1, 2, C.gold); rect(g, bx + 18, by + 11, 7, 1, C.woodDeep);
    props.push({ img: c, x: cx, y: cy, bottom: 5 * T });
  }
  return props;
}

// ---------------------------------------------------------------- hero
const HERO_SPR = {};
for (const k of Object.keys(HERO.frames)) HERO_SPR[k] = makeSprite(HERO.frames[k], HERO.palette);
const WALK = ["walk1", "idle", "walk2", "idle"];
const SPEED = 66;            // px per second
const HB = { w: 12, h: 7 };  // feet hitbox, anchored at (x, y) = bottom centre

const hero = { x: 6.5 * T, y: 10 * T + 18, dir: "up", faceRight: true, moving: false, t: 0 };

function blocked(x, y) {
  const x0 = Math.floor((x - HB.w / 2) / T), x1 = Math.floor((x + HB.w / 2 - 0.01) / T);
  const y0 = Math.floor((y - HB.h) / T), y1 = Math.floor((y - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (SOLID.has(tileAt(tx, ty))) return true;
  return false;
}
function moveAxis(dx, dy) {
  const dist = Math.abs(dx || dy), step = Math.sign(dx || dy);
  let moved = 0;
  while (moved < dist) {
    const s = Math.min(1, dist - moved) * step;
    const nx = hero.x + (dx ? s : 0), ny = hero.y + (dy ? s : 0);
    if (blocked(nx, ny)) break;
    hero.x = nx; hero.y = ny; moved += Math.abs(s);
  }
}
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function heroTile() { return [Math.floor(hero.x / T), Math.floor((hero.y - HB.h / 2) / T)]; }
function cursorTile() { const [tx, ty] = heroTile(), [dx, dy] = DIRS[hero.dir]; return [tx + dx, ty + dy]; }
function currentTarget() { const [cx, cy] = cursorTile(); return TARGETS.get(`${cx},${cy}`) || null; }

// ---------------------------------------------------------------- input
const keys = new Set();
const stickVec = { x: 0, y: 0 };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(k)) { keys.add(k); e.preventDefault(); }
  if ((k === " " || k === "enter" || k === "z" || k === "j") && !e.repeat) { interact(); e.preventDefault(); }
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("contextmenu", e => e.preventDefault());

const pad = document.getElementById("pad"), stick = document.getElementById("stick"), knob = document.getElementById("knob");
const padHint = document.getElementById("padHint");
let padId = null, padOrigin = null;
const R = 44;
pad.addEventListener("pointerdown", e => {
  if (padId !== null) return;
  padId = e.pointerId; pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect();
  padOrigin = { x: e.clientX, y: e.clientY };
  stick.style.left = (e.clientX - r.left) + "px"; stick.style.top = (e.clientY - r.top) + "px";
  stick.hidden = false; padHint.hidden = true; knob.style.transform = "";
});
pad.addEventListener("pointermove", e => {
  if (e.pointerId !== padId) return;
  let dx = e.clientX - padOrigin.x, dy = e.clientY - padOrigin.y;
  const len = Math.hypot(dx, dy);
  if (len > R) { dx *= R / len; dy *= R / len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, len / R);
  stickVec.x = m < 0.2 ? 0 : dx / R; stickVec.y = m < 0.2 ? 0 : dy / R;
});
const padEnd = e => {
  if (e.pointerId !== padId) return;
  padId = null; stickVec.x = stickVec.y = 0; stick.hidden = true; padHint.hidden = false;
};
pad.addEventListener("pointerup", padEnd); pad.addEventListener("pointercancel", padEnd);

const act = document.getElementById("act");
act.addEventListener("pointerdown", e => { e.preventDefault(); act.classList.add("on"); interact(); });
const actOff = () => act.classList.remove("on");
act.addEventListener("pointerup", actOff); act.addEventListener("pointerleave", actOff); act.addEventListener("pointercancel", actOff);
act.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") e.stopPropagation(); });
act.addEventListener("click", e => { if (e.detail === 0) interact(); });

function inputVector() {
  let x = 0, y = 0;
  if (keys.has("arrowleft") || keys.has("a")) x -= 1;
  if (keys.has("arrowright") || keys.has("d")) x += 1;
  if (keys.has("arrowup") || keys.has("w")) y -= 1;
  if (keys.has("arrowdown") || keys.has("s")) y += 1;
  if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
  return { x: stickVec.x, y: stickVec.y };
}

// ---------------------------------------------------------------- interaction feedback
const msg = document.getElementById("msg"), targetChip = document.getElementById("target");
let msgTimer = 0, flash = 0;
function interact() {
  const t = currentTarget();
  flash = 0.25;
  if (!t) return;
  const [line, note] = ACTIONS[t.kind](t);
  msg.innerHTML = "";
  msg.append(line);
  const s = document.createElement("small"); s.textContent = note; msg.append(s);
  msg.hidden = false; msg.style.opacity = 1; msgTimer = 2.6;
}

// ---------------------------------------------------------------- loop
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
canvas.width = W; canvas.height = H; ctx.imageSmoothingEnabled = false;
const BG = drawBackground(), PROPS = makeProps();

function update(dt) {
  const v = inputVector();
  const mag = Math.hypot(v.x, v.y);
  hero.moving = mag > 0.01;
  if (hero.moving) {
    if (Math.abs(v.x) > Math.abs(v.y)) hero.dir = v.x > 0 ? "right" : "left";
    else hero.dir = v.y > 0 ? "down" : "up";
    if (Math.abs(v.x) > 0.3) hero.faceRight = v.x > 0;
    moveAxis(v.x * SPEED * dt, 0);
    moveAxis(0, v.y * SPEED * dt);
    hero.t += dt;
  } else hero.t = 0;
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0.3) msg.style.opacity = Math.max(0, msgTimer / 0.3); if (msgTimer <= 0) msg.hidden = true; }
  if (flash > 0) flash -= dt;
  const t = currentTarget();
  const label = t ? `▶ ${t.name}` : "";
  if (targetChip.textContent !== label) { targetChip.textContent = label; targetChip.hidden = !t; }
}

function drawHero() {
  const frame = hero.moving ? WALK[Math.floor(hero.t / 0.14) % 4] : "idle";
  const bob = frame === "idle" ? 0 : 1;
  const spr = HERO_SPR[frame][hero.faceRight ? "right" : "left"];
  const x = Math.round(hero.x), y = Math.round(hero.y);
  ctx.fillStyle = "rgba(29,24,38,0.35)";
  ctx.fillRect(x - 6, y - 2, 12, 2); ctx.fillRect(x - 4, y - 3, 8, 4);
  ctx.drawImage(spr, x - 12, y - 23 - bob);
}

function drawCursor(time) {
  const [cx, cy] = cursorTile();
  const has = TARGETS.has(`${cx},${cy}`);
  const x = cx * T, y = cy * T;
  const pulse = (Math.sin(time * 6) + 1) / 2;
  ctx.globalAlpha = has ? 0.75 + 0.25 * pulse : 0.45;
  const col = flash > 0 ? "#ffffff" : has ? C.gold : "#f3e9d6";
  // corner brackets: dark backing one pixel inside, then the colour line
  const L = 6, E = T - 1;
  const corners = [[x, y, 1, 1], [x + E, y, -1, 1], [x, y + E, 1, -1], [x + E, y + E, -1, -1]];
  for (const [px, py, sx, sy] of corners) {
    for (const [fill, inset] of [[PIXEL_OUTLINE, 1], [col, 0]]) {
      ctx.fillStyle = fill;
      const ox = px + sx * inset, oy = py + sy * inset;
      ctx.fillRect(sx > 0 ? ox : ox - L + 1, oy, L, 1);
      ctx.fillRect(ox, sy > 0 ? oy : oy - L + 1, 1, L);
    }
  }
  if (has) { ctx.globalAlpha = 0.12 + 0.1 * pulse; ctx.fillStyle = C.gold; ctx.fillRect(x + 1, y + 1, T - 2, T - 2); }
  ctx.globalAlpha = 1;
}

function render(time) {
  ctx.drawImage(BG, 0, 0);
  const list = PROPS.map(p => ({ b: p.bottom, draw: () => ctx.drawImage(p.img, p.x, p.y) }));
  list.push({ b: hero.y, draw: drawHero });
  list.sort((a, b) => a.b - b.b).forEach(o => o.draw());
  drawCursor(time);
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- sizing
const view = document.getElementById("view"), screenEl = document.getElementById("screen");
function fit() {
  const r = view.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const s = Math.min(r.width / W, r.height / H) * dpr;
  // integer device pixels keep every dot the same size; fall back to a fractional scale when that would waste >10% of the space
  const css = (s >= 1 && Math.floor(s) / s >= 0.9 ? Math.floor(s) : s) / dpr;
  screenEl.style.width = W * css + "px"; screenEl.style.height = H * css + "px";
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe(view);

function start(data) {
  if (data && typeof data.x === "number") Object.assign(hero, { x: data.x, y: data.y, dir: data.dir || "up", faceRight: data.faceRight !== false });
  fit();
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ x: hero.x, y: hero.y, dir: hero.dir, faceRight: hero.faceRight }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
