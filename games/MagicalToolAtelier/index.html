<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen game. Portrait = shop view on top, touch controls below. Landscape = controls float over the side margins. */
:root {
  color-scheme: dark;
  --bg: #17131d;          /* night outside the shop */
  --panel: #241c2c;       /* control deck */
  --ink: #f3e9d6;         /* parchment text */
  --muted: #a99bb4;
  --gold: #e3b341;        /* the hero's hat band */
  --navy: #2b3768;        /* the hero's cape */
  --line: #3b2f47;
  --ng: #e0303c;          /* cannot place */
  --font-ui: "DotGothic16", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-ui);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
}
#stage {
  position: fixed; inset: 0; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
#view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
#screen { position: relative; }
#game { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#msg {
  position: absolute; left: 4%; right: 4%; bottom: 3%;
  background: color-mix(in srgb, var(--bg) 88%, transparent); border: 2px solid var(--gold);
  box-shadow: 0 0 0 2px var(--bg); padding: 8px 12px; font-size: 15px; line-height: 1.5;
  transition: opacity .2s; pointer-events: none;
}
#msg small { display: block; color: var(--muted); font-size: 13px; }
#target {
  position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 12px; padding: 2px 8px; font-size: 13px; white-space: nowrap;
  background: color-mix(in srgb, var(--bg) 80%, transparent); border: 1px solid var(--line); color: var(--gold);
  pointer-events: none;
}
#controls {
  height: 196px; flex: none; position: relative; background: var(--panel); border-top: 2px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#pad { position: absolute; left: 0; top: 0; bottom: 0; width: 46%; }
#padHint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 108px; height: 108px; border-radius: 50%; border: 2px dashed var(--line);
  display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center;
}
#stick { position: absolute; width: 108px; height: 108px; margin: -54px 0 0 -54px; border-radius: 50%;
  border: 2px solid var(--muted); background: color-mix(in srgb, var(--navy) 45%, transparent); pointer-events: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%;
  background: var(--ink); opacity: .85; }
#act {
  position: absolute; right: max(28px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%);
  width: 96px; height: 96px; border-radius: 50%; border: 3px solid var(--gold); background: var(--navy);
  color: var(--ink); font-family: var(--font-ui); font-size: 18px; cursor: pointer; touch-action: none;
}
#carry {
  position: absolute; right: calc(max(28px, env(safe-area-inset-right, 0px)) + 112px); top: 50%; transform: translateY(-50%);
  width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--ink); background: var(--line);
  color: var(--ink); font-family: var(--font-ui); font-size: 16px; cursor: pointer; touch-action: none;
}
#carry.ng { border-color: var(--ng); color: var(--muted); }
#act:active, #act.on, #carry.on { background: var(--gold); color: var(--bg); }
#carry.ng.on { background: var(--line); color: var(--muted); }
#act:disabled { border-color: var(--line); color: var(--muted); background: var(--panel); }
#act:focus-visible, #carry:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#keys { position: absolute; left: 8px; right: 8px; bottom: 8px; font-size: 11px; color: var(--muted); text-align: center; }
#carry.wide { width: 108px; height: 60px; border-radius: 30px; padding: 0; font-size: 14px; white-space: nowrap; right: calc(max(28px, env(safe-area-inset-right, 0px)) + 108px); }
#hud {
  position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); top: max(10px, env(safe-area-inset-top, 0px));
  font-size: 15px; color: var(--ink); background: color-mix(in srgb, var(--bg) 70%, transparent);
  border: 1px solid var(--line); padding: 4px 10px; pointer-events: none; font-variant-numeric: tabular-nums; z-index: 2;
}
#gear {
  position: absolute; right: max(12px, env(safe-area-inset-right, 0px)); top: max(8px, env(safe-area-inset-top, 0px));
  width: 44px; height: 44px; display: grid; place-items: center; z-index: 2;
  background: var(--panel); color: var(--ink); border: 2px solid var(--line); border-radius: 50%; cursor: pointer;
}
#gear:hover { color: var(--gold); border-color: var(--gold); }
#gear:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#options {
  position: fixed; inset: 0; z-index: 10; display: grid; place-items: center;
  background: color-mix(in srgb, var(--bg) 70%, transparent);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet {
  width: min(360px, 100%); background: var(--panel); border: 2px solid var(--gold); box-shadow: 0 0 0 3px var(--bg);
  padding: 16px 18px 18px; display: grid; gap: 14px;
}
.sheet h2 { margin: 0; font-size: 18px; font-weight: normal; letter-spacing: .1em; color: var(--gold); }
.opt { display: grid; gap: 8px; }
.opt-label { font-size: 15px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 2px solid var(--line); }
.seg button {
  font: inherit; font-size: 15px; padding: 10px 0; border: 0; background: transparent; color: var(--muted); cursor: pointer;
}
.seg button[aria-checked="true"] { background: var(--navy); color: var(--ink); box-shadow: inset 0 -3px 0 var(--gold); }
.seg button:focus-visible, #optClose:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
.desc { margin: 0; font-size: 13px; line-height: 1.6; color: var(--muted); }
.meta { margin: 0; font-size: 12px; line-height: 1.7; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; }
#optClose { font: inherit; font-size: 15px; padding: 10px; background: var(--line); color: var(--ink); border: 0; cursor: pointer; }
@media (orientation: landscape) {
  #controls { position: absolute; inset: auto 0 0 0; height: 60%; background: none; border: 0; pointer-events: none; }
  #pad { width: 35%; pointer-events: auto; }
  #act, #carry { pointer-events: auto; }
  #padHint, #keys { opacity: .6; }
  #target { top: auto; bottom: calc(50% + 64px); right: max(16px, env(safe-area-inset-right, 0px)); }
  #keys { position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); right: auto; top: 56px; bottom: auto; text-align: left; max-width: 22%; }
}
@media (prefers-reduced-motion: reduce) { #msg { transition: none; } }
</style>

<div id="stage">
  <div id="hud"><span id="clock">1日目 00:00</span></div>
  <button id="gear" type="button" aria-label="オプション">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><g fill="currentColor"><rect x="10" y="1" width="4" height="22"/><rect x="10" y="1" width="4" height="22" transform="rotate(45 12 12)"/><rect x="10" y="1" width="4" height="22" transform="rotate(90 12 12)"/><rect x="10" y="1" width="4" height="22" transform="rotate(135 12 12)"/><circle cx="12" cy="12" r="7.5"/></g><circle cx="12" cy="12" r="3" fill="var(--panel)"/></svg>
  </button>
  <div id="view">
    <div id="screen">
      <canvas id="game" width="312" height="288" aria-label="お店と工房"></canvas>
      <div id="msg" hidden></div>
    </div>
  </div>
  <div id="controls">
    <div id="pad"><div id="padHint">ドラッグで<br>移動</div><div id="stick" hidden><div id="knob"></div></div></div>
    <div id="target" hidden></div>
    <button id="carry" type="button" hidden>持つ</button>
    <button id="act" type="button">調べる</button>
    <div id="keys">キーボード　矢印・WASD：移動　Space・Enter：調べる　X：持つ・置く</div>
  </div>
</div>

<div id="options" role="dialog" aria-modal="true" aria-labelledby="optTitle" hidden>
  <div class="sheet">
    <h2 id="optTitle">オプション</h2>
    <div class="opt">
      <div class="opt-label" id="modeLabel">時間の流れ方</div>
      <div class="seg" id="modeSeg" role="radiogroup" aria-labelledby="modeLabel">
        <button type="button" role="radio" data-mode="real" aria-checked="true">リアル</button>
        <button type="button" role="radio" data-mode="game" aria-checked="false">ゲーム</button>
      </div>
      <p class="desc" id="modeDesc"></p>
    </div>
    <p class="meta"><span id="awayInfo"></span><br><span id="saveInfo"></span></p>
    <button id="optClose" type="button">閉じる</button>
  </div>
</div>

// ---------------------------------------------------------------- pixel helpers (docs/pixel-art/tools/sprite.js)
const PIXEL_OUTLINE = "#1d1826";
function makeSprite(grid, palette, outlineColor = PIXEL_OUTLINE) {
  const h = grid.length, w = grid[0].length;
  const filled = (x, y) => x >= 0 && y >= 0 && x < w && y < h && grid[y][x] !== ".";
  const right = document.createElement("canvas");
  right.width = w; right.height = h;
  const ctx = right.getContext("2d");
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = grid[y][x];
      let color = null;

        if (!color) throw new Error(`unknown char ${ch} at ${x},${y}`);

// ---------------------------------------------------------------- rooms (fixed parts only; shelves, the bed etc. are furniture below)
// # wall  E entrance  K counter  B counter with checkout board  P passage to the other room
const T = 24;
const ROOMS = {
  shop: {
    name: "お店", other: "workshop", spawnX: 11, spawnDir: "left",
    map: [
      "#############",
      "#############",
      "#...........P",
      "#.......K...#",
      "#.......KKBK#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........P",
      "######E######",
    ],
  },
  workshop: {
    name: "工房", other: "shop", spawnX: 1, spawnDir: "right",
    map: [
      "#############",
      "#############",
      "P...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "#...........#",
      "P...........#",
      "#############",
    ],
  },
};
const COLS = 13, ROWS = 12, W = COLS * T, H = ROWS * T;
const FIXED_SOLID = new Set(["#", "E", "K", "B"]);
const tileAt = (tx, ty, room = world.room) => (tx < 0 || ty < 0 || tx >= COLS || ty >= ROWS) ? "#" : ROOMS[room].map[ty][tx];
// ---------------------------------------------------------------- time
// clock = game minutes since day 1, 00:00.  "real": follows the device clock and keeps running while closed.
// "game": one day per 30 real minutes (30 s while in bed) and stops while the game is closed.
const DAY = 1440;
const RATE = { game: DAY / (30 * 60), bed: DAY / 30 }; // game minutes per real second
const world = { mode: "real", clock: 0, inBed: false, awayMs: null, room: "shop" };
const mod = (a, n) => ((a % n) + n) % n;

function realTOD(d = new Date()) { return d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60 + d.getMilliseconds() / 60000; }

  lastRealMs = now;
  if (world.mode === "real") followRealClock(realMinutes);
  else world.clock += dt * (world.inBed ? RATE.bed : RATE.game);
}

  if (mode === world.mode) return;
  world.mode = mode;
  lastRealMs = Date.now();
  if (mode === "real") followRealClock(0);
  saveSoon(true);

// ---------------------------------------------------------------- furniture
// Everything placed in a room is furniture; types differ only in these settings.
// rooms = where a movable piece may be carried (a passage to any other room blocks it).
const BOTH = ["shop", "workshop"];
const FURNITURE_TYPES = {
  wallShelf: { kind: "shelf", name: "背の高い棚", movable: false, w: 1, h: 1 },
  table: { kind: "shelf", name: "陳列台", movable: true, w: 1, h: 1, rooms: ["shop"] },
  rack: { kind: "rack", name: "乾燥棚", movable: true, w: 1, h: 1, rooms: BOTH },
  chest: { kind: "chest", name: "宝箱", movable: true, w: 1, h: 1, rooms: BOTH },
  bed: { kind: "bed", name: "ベッド", movable: false, w: 1, h: 2, exit: { dx: -1, dy: 1, dir: "left" } },
  cauldron: { kind: "cauldron", name: "大鍋", movable: false, w: 2, h: 2 },
  step: { kind: "step", name: "足場", movable: false, w: 1, h: 1 },

function initialFurniture() {
  const list = [], count = {};
  const add = (type, room, tx, ty) => {
    const kind = FURNITURE_TYPES[type].kind;
    count[kind] = (count[kind] || 0) + 1;
    list.push({ id: list.length, type, room, tx, ty, no: count[kind], held: false });
  };
  // ids 0-12 keep the order of earlier saves
  for (let x = 1; x <= 4; x++) add("wallShelf", "shop", x, 2);
  for (let x = 2; x <= 5; x++) add("table", "shop", x, 6);
  for (let x = 2; x <= 5; x++) add("table", "shop", x, 7);
  add("bed", "workshop", 11, 2);
  add("chest", "shop", 9, 7);
  add("chest", "workshop", 2, 4);
  for (let x = 8; x <= 10; x++) add("rack", "workshop", x, 8);

const placeable = {};

  for (const room of Object.keys(ROOMS)) {
    const grid = placeable[room] = [];
    for (let ty = 0; ty < ROWS; ty++) {
      grid.push([]);
      for (let tx = 0; tx < COLS; tx++) {
        let ok = !fixedAt(tx, ty, room) && tileAt(tx, ty, room) !== "P";

const STATIC_TARGETS = {
  B: { kind: "board", name: "会計ボード" },

function furnitureName(f) {
  const tp = typeOf(f);
  if (tp.kind === "shelf") return `商品棚 ${f.no}`;
  if (tp.kind === "rack") return `乾燥棚 ${f.no}`;
  return tp.name;

function targetAt(tx, ty) {

const NIGHT = [26, 36, 96], DAWN = [255, 236, 160], DUSK = [255, 112, 60];
const FILTER = [ // [minute, [r, g, b, alpha]]
  [0, [...NIGHT, 0.17]], [210, [...NIGHT, 0.16]], [330, [...DAWN, 0.07]], [400, [...DAWN, 0.06]], [510, [...DAWN, 0]],
  [930, [...DUSK, 0]], [1030, [...DUSK, 0.08]], [1095, [240, 90, 70, 0.09]], [1180, [...NIGHT, 0.12]], [1290, [...NIGHT, 0.15]],
];
function filterAt(m) {
  const pre = keyed(FILTER.map(([k, v]) => [k, [v[0] * v[3], v[1] * v[3], v[2] * v[3], v[3]]]), m, lerpRGB);
  const a = pre[3];
  return a < 0.002 ? null : `rgba(${[0, 1, 2].map(i => Math.round(pre[i] / a)).join(",")},${a.toFixed(3)})`;
}

// Window view: sky gradient, hills, a far cottage, sun/moon and stars.
const WIN = { x: 5 * T + 11, y: 8, w: 38, h: 20 };
const STARS = [[3, 2], [9, 5], [14, 1], [22, 3], [27, 6], [33, 2], [6, 8], [30, 9], [18, 7]];
function hillHeight(x, far) { return far ? 6 + Math.round(2 * Math.sin(x * 0.21 + 1.3) + Math.sin(x * 0.53)) : 3 + Math.round(1.6 * Math.sin(x * 0.31 + 4) + 0.8 * Math.sin(x * 0.9)); }
function drawWindow(m, time) {
  const { x, y, w, h } = WIN;
  const [top, bottom] = keyed(SKY, m, (a, b, t) => [lerpRGB(a[0], b[0], t), lerpRGB(a[1], b[1], t)]);
  const light = keyed(DAYLIGHT, m, lerpNum);
  for (let r = 0; r < h; r++) { ctx.fillStyle = rgb(lerpRGB(top, bottom, r / (h - 1))); ctx.fillRect(x, y + r, w, 1); }
  // stars
  if (light < 0.6) {
    STARS.forEach(([sx, sy], i) => {
      ctx.globalAlpha = (1 - light / 0.6) * (0.55 + 0.45 * Math.sin(time * 1.7 + i * 2.1));
      ctx.fillStyle = "#fff8d8"; ctx.fillRect(x + sx, y + sy, 1, 1);
    });
    ctx.globalAlpha = 1;
  }
  // sun (05:30-18:30) and moon (18:30-05:30) on an arc across the panes
  const arc = (p, color, size) => {
    const px = Math.round(x + 1 + p * (w - 2 - size)), py = Math.round(y + h - 5 - Math.sin(Math.PI * p) * (h - 9));
    ctx.fillStyle = color; ctx.fillRect(px, py + 1, size, size - 2); ctx.fillRect(px + 1, py, size - 2, size);
  };
  if (m >= 330 && m <= 1110) {
    const p = (m - 330) / 780;
    arc(p, rgb(lerpRGB(hex("#ffb060"), hex("#fff3b0"), Math.sin(Math.PI * p))), 4);
  } else {
    const p = mod(m - 1110, DAY) / 660;
    arc(p, "#f1ecd2", 3);
  }
  // hills and a cottage with a lamp at night
  const farCol = lerpRGB(hex("#232c48"), hex("#88a8a0"), light), nearCol = lerpRGB(hex("#161d2c"), hex("#5d8a4e"), light);
  for (let i = 0; i < w; i++) { const hh = hillHeight(i, true); ctx.fillStyle = rgb(farCol); ctx.fillRect(x + i, y + h - hh, 1, hh); }
  const hx = x + 25, hy = y + h - hillHeight(25, true) - 3;
  ctx.fillStyle = rgb(lerpRGB(hex("#2a2030"), hex("#c9b49a"), light)); ctx.fillRect(hx, hy, 5, 3);
  ctx.fillStyle = rgb(lerpRGB(hex("#3a1e22"), hex("#a0483e"), light)); ctx.fillRect(hx - 1, hy - 1, 7, 1); ctx.fillRect(hx, hy - 2, 5, 1);
  if (light < 0.5) { ctx.fillStyle = "#ffd36a"; ctx.fillRect(hx + 2, hy + 1, 1, 1); }
  for (let i = 0; i < w; i++) { const hh = hillHeight(i, false); ctx.fillStyle = rgb(nearCol); ctx.fillRect(x + i, y + h - hh, 1, hh); }
  // frame bars and glass glints over the view
  ctx.fillStyle = C.wallTop; ctx.fillRect(x + 18, y, 2, h); ctx.fillRect(x, y + 9, w, 2);
  ctx.globalAlpha = 0.35; ctx.fillStyle = C.glassHi;
  for (let i = 0; i < 6; i++) ctx.fillRect(x + 3 + i, y + 7 - i, 1, 1);
  for (let i = 0; i < 5; i++) ctx.fillRect(x + 23 + i, y + 19 - i, 1, 1);
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- hero
const HERO_SPR = {};
for (const k of Object.keys(HERO.frames)) HERO_SPR[k] = makeSprite(HERO.frames[k], HERO.palette);
const WALK = ["walk1", "idle", "walk2", "idle"];
const SPEED = 66;            // px per second
const HB = { w: 12, h: 7 };  // feet hitbox, anchored at (x, y) = bottom centre

const hero = { x: 6.5 * T, y: 10 * T + 18, dir: "up", faceRight: true, moving: false, t: 0 };

function boxTiles(x, y, fn) {
  const x0 = Math.floor((x - HB.w / 2) / T), x1 = Math.floor((x + HB.w / 2 - 0.01) / T);
  const y0 = Math.floor((y - HB.h) / T), y1 = Math.floor((y - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (fn(tx, ty)) return true;
  return false;
}
const blocked = (x, y) => boxTiles(x, y, solidAt);
function moveAxis(dx, dy) {
  const dist = Math.abs(dx || dy), step = Math.sign(dx || dy);
  let moved = 0;
  while (moved < dist) {
    const s = Math.min(1, dist - moved) * step;
    const nx = hero.x + (dx ? s : 0), ny = hero.y + (dy ? s : 0);
    if (blocked(nx, ny)) { if (boxTiles(nx, ny, passageBlocked)) warnPassage(); break; }
    hero.x = nx; hero.y = ny; moved += Math.abs(s);
  }
}
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function heroTile() { return [Math.floor(hero.x / T), Math.floor((hero.y - HB.h / 2) / T)]; }
function cursorTile() { const [tx, ty] = heroTile(), [dx, dy] = DIRS[hero.dir]; return [tx + dx, ty + dy]; }
function currentTarget() { const [cx, cy] = cursorTile(); return targetAt(cx, cy); }

// Can the carried furniture go down on this tile right now?
function canPlaceAt(tx, ty) {
  if (!placeable[world.room][ty]?.[tx] || furnitureAt(tx, ty)) return false;
  return !boxTiles(hero.x, hero.y, (x, y) => x === tx && y === ty); // not on top of the hero
}

const msg = document.getElementById("msg"), targetChip = document.getElementById("target");
let msgTimer = 0, flash = 0;
function say(line, note) {
  msg.innerHTML = "";
  msg.append(line);
  if (note) { const s = document.createElement("small"); s.textContent = note; msg.append(s); }
  msg.hidden = false; msg.style.opacity = 1; msgTimer = 2.6;
}
function examine() {

  flash = 0.25;

}
// The middle button: what it does depends on the hero and the cursor.
function contextMode() {
  if (world.inBed) return "bedOut";
  if (held) return "place";
  const f = currentTarget()?.furniture;
  if (!f) return null;
  if (isMovable(f)) return "lift";
  if (typeOf(f).kind === "bed") return "bedIn";
  return null;
}
const bed = () => furniture.find(f => f.type === "bed");
function contextAction() {
  if (optionsOpen()) return;
  const mode = contextMode();
  if (mode === "lift") {
    held = currentTarget().furniture; held.held = true; flash = 0.25; saveSoon();
  } else if (mode === "place") {
    const [cx, cy] = cursorTile();
    if (!canPlaceAt(cx, cy)) { say("ここには置けない。", "壁やカウンターなど動かせないものの隣（赤いマス）や、ふさがっているマスには置けない"); return; }
    held.room = world.room; held.tx = cx; held.ty = cy; held.held = false; held = null; flash = 0.25; saveSoon();
  } else if (mode === "bedIn") {
    world.inBed = true; msg.hidden = true; msgTimer = 0; saveSoon();
  } else if (mode === "bedOut") {
    world.inBed = false;
    placeHeroAtBedExit();
    saveSoon();
  }
}
function placeHeroAtBedExit() {
  const b = bed(), ex = FURNITURE_TYPES.bed.exit;
  world.room = b.room;
  hero.x = (b.tx + ex.dx + 0.5) * T; hero.y = (b.ty + ex.dy + 1) * T - 6;
  hero.dir = ex.dir; hero.faceRight = ex.dir === "right";
}

// Stepping onto a passage moves the hero to the other room, out of the passage on the same row.
let fade = 0, warnedAt = -1e9;
function enterRoom(room, ty) {
  const r = ROOMS[room];
  world.room = room;
  hero.x = (r.spawnX + 0.5) * T; hero.y = (ty + 1) * T - 6;
  hero.dir = r.spawnDir; hero.faceRight = r.spawnDir === "right";
  fade = 1; saveSoon();
}
function warnPassage() {
  const now = performance.now();
  if (now - warnedAt < 2500) return;
  warnedAt = now;
  say(`${typeOf(held).name}は${ROOMS[world.room].name}から持ち出せない。`, `${typeOf(held).name}は${(typeOf(held).rooms || []).map(r => ROOMS[r].name).join("・")}でしか使えない`);
}
// ---------------------------------------------------------------- input
const keys = new Set();
const stickVec = { x: 0, y: 0 };
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (optionsOpen()) { if (k === "escape") closeOptions(); return; }
  if (["arrowup", "arrowdown", "arrowleft", "arrowright", "w", "a", "s", "d"].includes(k)) { keys.add(k); e.preventDefault(); }
  if (e.repeat) return;
  if (k === " " || k === "enter" || k === "z" || k === "j") { examine(); e.preventDefault(); }
  if (k === "x" || k === "k") { contextAction(); e.preventDefault(); }
});
addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("contextmenu", e => e.preventDefault());

const pad = document.getElementById("pad"), stick = document.getElementById("stick"), knob = document.getElementById("knob");
const padHint = document.getElementById("padHint");
let padId = null, padOrigin = null;
const R = 44;
pad.addEventListener("pointerdown", e => {
  if (padId !== null) return;
  padId = e.pointerId; pad.setPointerCapture(e.pointerId);
  const r = pad.getBoundingClientRect();
  padOrigin = { x: e.clientX, y: e.clientY };
  stick.style.left = (e.clientX - r.left) + "px"; stick.style.top = (e.clientY - r.top) + "px";
  stick.hidden = false; padHint.hidden = true; knob.style.transform = "";
});
pad.addEventListener("pointermove", e => {
  if (e.pointerId !== padId) return;
  let dx = e.clientX - padOrigin.x, dy = e.clientY - padOrigin.y;
  const len = Math.hypot(dx, dy);
  if (len > R) { dx *= R / len; dy *= R / len; }
  knob.style.transform = `translate(${dx}px, ${dy}px)`;
  const m = Math.min(1, len / R);
  stickVec.x = m < 0.2 ? 0 : dx / R; stickVec.y = m < 0.2 ? 0 : dy / R;
});
const padEnd = e => {
  if (e.pointerId !== padId) return;
  padId = null; stickVec.x = stickVec.y = 0; stick.hidden = true; padHint.hidden = false;
};
pad.addEventListener("pointerup", padEnd); pad.addEventListener("pointercancel", padEnd);

function bindButton(el, fn) {
  el.addEventListener("pointerdown", e => { e.preventDefault(); el.classList.add("on"); fn(); });
  const off = () => el.classList.remove("on");
  el.addEventListener("pointerup", off); el.addEventListener("pointerleave", off); el.addEventListener("pointercancel", off);
  el.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") e.stopPropagation(); });
  el.addEventListener("click", e => { if (e.detail === 0) fn(); });
}
const act = document.getElementById("act"), ctxBtn = document.getElementById("carry");
bindButton(act, examine);
bindButton(ctxBtn, contextAction);

function inputVector() {
  if (world.inBed || optionsOpen()) return { x: 0, y: 0 };
  let x = 0, y = 0;
  if (keys.has("arrowleft") || keys.has("a")) x -= 1;
  if (keys.has("arrowright") || keys.has("d")) x += 1;
  if (keys.has("arrowup") || keys.has("w")) y -= 1;
  if (keys.has("arrowdown") || keys.has("s")) y += 1;
  if (x || y) { const l = Math.hypot(x, y); return { x: x / l, y: y / l }; }
  return { x: stickVec.x, y: stickVec.y };
}

const optionsEl = document.getElementById("options"), gear = document.getElementById("gear");
const modeButtons = [...document.querySelectorAll("#modeSeg button")];
const MODE_TEXT = {

};

}

// ---------------------------------------------------------------- saving (this device always; the account too when available)
const SAVE_KEY = "MagicalToolAtelier.save.v1"; // the key stays; the data inside carries its own version
const cloud = { doc: null, writing: false, lastKey: "" };
function serialize() {
  const now = Date.now();
  return {
    v: 2, savedAt: now, lastSeen: now, mode: world.mode, clock: world.clock, inBed: world.inBed, room: world.room,
    hero: { x: hero.x, y: hero.y, dir: hero.dir, faceRight: hero.faceRight },
    furniture: furniture.map(f => ({ room: f.room, tx: f.tx, ty: f.ty })), held: held ? held.id : null,
  };
}
function applySave(s) {
  if (!s || (s.v !== 1 && s.v !== 2)) return false;
  const now = Date.now();
  furniture = initialFurniture();
  if (Array.isArray(s.furniture)) {
    // version 1 (one room): only the 12 shop shelves keep their places; everything else starts at its default
    const keep = s.v === 1 ? 12 : furniture.length;
    s.furniture.slice(0, keep).forEach((d, i) => {
      if (furniture[i] && d) Object.assign(furniture[i], { tx: d.tx, ty: d.ty, room: d.room || "shop" });
    });
  }
  held = s.held != null && s.held < (s.v === 1 ? 12 : furniture.length) && furniture[s.held] ? furniture[s.held] : null;
  if (held) held.held = true;
  world.room = ROOMS[s.room] ? s.room : "shop";
  if (s.hero) Object.assign(hero, s.hero);
  world.mode = s.mode === "game" ? "game" : "real";
  world.inBed = !!s.inBed;
  if (world.inBed) world.room = bed().room;
  world.clock = Number(s.clock) || 0;
  world.awayMs = typeof s.lastSeen === "number" ? Math.max(0, now - s.lastSeen) : null;
  lastRealMs = now;
  if (world.mode === "real") followRealClock((world.awayMs || 0) / 60000);
  return true;
}
function saveLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(serialize())); } catch (e) {} }
function loadLocal() { try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; } }
// what counts as a change worth sending (in "real" mode the clock follows the device, so it is left out)
function contentKey(s) { return JSON.stringify({ ...s, savedAt: 0, lastSeen: 0, clock: s.mode === "real" ? 0 : Math.floor(s.clock) }); }
async function saveCloud(force) {
  if (!cloud.doc || cloud.writing) return;
  const s = serialize(), key = contentKey(s);
  if (!force && key === cloud.lastKey) return;
  cloud.writing = true;
  try { await cloud.doc.set(s); cloud.lastKey = key; } catch (e) { if (e?.code === "invalid_argument" || e?.code === "revoked") cloud.doc = null; }
  cloud.writing = false;
}
let saveTimer = 0;
function saveSoon(force) { saveLocal(); clearTimeout(saveTimer); saveTimer = setTimeout(() => saveCloud(force), 1500); }
setInterval(saveLocal, 5000);
setInterval(() => saveCloud(false), 60000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { saveLocal(); saveCloud(true); }
  else { lastRealMs = Date.now(); }
});
addEventListener("pagehide", saveLocal);

async function connectCloud(startedFrom) {
  const c = window.claude;
  if (!c?.use) return;
  try {
    const [db, user] = await Promise.all([c.use("db"), c.use("user")]);
    if (!db || !user) return;
    const id = await user.id();
    if (!id) return;
    const doc = db.doc(`data/users/${id}/save`);
    const snap = await Promise.race([doc.get(), new Promise(r => setTimeout(() => r(null), 10000))]);
    cloud.doc = doc;
    const s = snap?.exists ? snap.data() : null;
    // another device saved more recently than what this one started from: continue from that
    if (s && (s.v === 1 || s.v === 2) && (s.savedAt || 0) > (startedFrom?.savedAt || 0)) applySave(structuredClone(s));
    saveSoon(true);
  } catch (e) { /* stay on device-only saving */ }
}

// ---------------------------------------------------------------- loop
const canvas = document.getElementById("game"), ctx = canvas.getContext("2d");
canvas.width = W; canvas.height = H; ctx.imageSmoothingEnabled = false;
const BGS = { shop: drawBackground("shop"), workshop: drawBackground("workshop") }, COUNTER = makeCounter();
const clockEl = document.getElementById("clock");

const CONTEXT_LABEL = { lift: "持つ", place: "置く", bedIn: "布団に入る", bedOut: "布団から出る" };
let lastUi = "";
function updateUi() {
  const mode = contextMode();
  const [cx, cy] = cursorTile();
  const ng = mode === "place" && !canPlaceAt(cx, cy);
  const t = held || world.inBed ? null : currentTarget();
  const chip = world.inBed ? (world.mode === "game" ? "眠っている（時間が早く進んでいる）" : "眠っている")
    : held ? `${heldLabel(held)}を運んでいる` : t ? `▶ ${t.name}` : "";
  const m = tod();
  const clock = `${Math.floor(world.clock / DAY) + 1}日目 ${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.floor(m % 60)).padStart(2, "0")}　${ROOMS[world.room].name}`;
  const key = `${mode}|${ng}|${chip}|${!!held}|${world.inBed}|${clock}`;
  if (key === lastUi) return;
  lastUi = key;
  ctxBtn.hidden = !mode;
  if (mode) ctxBtn.textContent = CONTEXT_LABEL[mode];
  ctxBtn.classList.toggle("ng", ng);
  ctxBtn.classList.toggle("wide", mode === "bedIn" || mode === "bedOut");
  ctxBtn.setAttribute("aria-disabled", ng ? "true" : "false");
  act.disabled = !!held || world.inBed;
  targetChip.textContent = chip; targetChip.hidden = !chip;
  clockEl.textContent = clock;
}

function update(dt) {
  tickTime(dt);
  const v = inputVector();
  const mag = Math.hypot(v.x, v.y);
  hero.moving = mag > 0.01;
  if (hero.moving) {
    if (Math.abs(v.x) > Math.abs(v.y)) hero.dir = v.x > 0 ? "right" : "left";
    else hero.dir = v.y > 0 ? "down" : "up";
    if (Math.abs(v.x) > 0.3) hero.faceRight = v.x > 0;
    moveAxis(v.x * SPEED * dt, 0);
    moveAxis(0, v.y * SPEED * dt);
    hero.t += dt;
    const [tx, ty] = heroTile();
    if (tileAt(tx, ty) === "P") enterRoom(ROOMS[world.room].other, ty);
  } else hero.t = 0;
  if (fade > 0) fade = Math.max(0, fade - dt * 4);
  if (msgTimer > 0) { msgTimer -= dt; if (msgTimer <= 0.3) msg.style.opacity = Math.max(0, msgTimer / 0.3); if (msgTimer <= 0) msg.hidden = true; }
  if (flash > 0) flash -= dt;
  updateUi();
}

function drawHero() {
  const step = hero.moving ? WALK[Math.floor(hero.t / 0.14) % 4] : "idle";
  const bob = step === "idle" ? 0 : 1;
  const spr = HERO_SPR[(held ? "carry_" : "") + step][hero.faceRight ? "right" : "left"];
  const x = Math.round(hero.x), y = Math.round(hero.y);
  ctx.fillStyle = "rgba(29,24,38,0.35)";
  ctx.fillRect(x - 6, y - 2, 12, 2); ctx.fillRect(x - 4, y - 3, 8, 4);
  const sy = y - 23 - bob;
  ctx.drawImage(spr, x - 12, sy);
  // carried furniture rests on the raised hands, above the hat
  if (held) ctx.drawImage(FURNITURE_ART[held.type].img, x - 12, sy + 4 - FURNITURE_ART[held.type].img.height);
}

function drawNoPlaceZone() {
  ctx.fillStyle = C.ng;
  ctx.globalAlpha = 0.28;
  for (let ty = 0; ty < ROWS; ty++) for (let tx = 0; tx < COLS; tx++) {
    if (!FIXED_SOLID.has(tileAt(tx, ty)) && !placeable[world.room][ty][tx]) ctx.fillRect(tx * T, ty * T, T, T);
  }
  ctx.globalAlpha = 1;
}

function drawCursor(time) {
  if (world.inBed) return;
  const [cx, cy] = cursorTile();
  const x = cx * T, y = cy * T;
  const pulse = (Math.sin(time * 6) + 1) / 2;
  let col, alpha, fill = null;
  if (held) {
    const ok = canPlaceAt(cx, cy);
    if (ok) { // ghost of the furniture where it would land
      const art = FURNITURE_ART[held.type];
      ctx.globalAlpha = 0.45; ctx.drawImage(art.img, x, y - art.rise); ctx.globalAlpha = 1;
    }
    col = ok ? C.gold : C.ng; alpha = 0.8 + 0.2 * pulse; fill = ok ? null : C.ng;
  } else {
    const has = !!targetAt(cx, cy);
    col = has ? C.gold : "#f3e9d6"; alpha = has ? 0.75 + 0.25 * pulse : 0.45; fill = has ? C.gold : null;
  }
  if (flash > 0) col = "#ffffff";
  ctx.globalAlpha = alpha;
  // corner brackets: dark backing one pixel inside, then the colour line
  const L = 6, E = T - 1;
  const corners = [[x, y, 1, 1], [x + E, y, -1, 1], [x, y + E, 1, -1], [x + E, y + E, -1, -1]];
  for (const [px, py, sx, sy] of corners) {
    for (const [c, inset] of [[PIXEL_OUTLINE, 1], [col, 0]]) {
      ctx.fillStyle = c;
      const ox = px + sx * inset, oy = py + sy * inset;
      ctx.fillRect(sx > 0 ? ox : ox - L + 1, oy, L, 1);
      ctx.fillRect(ox, sy > 0 ? oy : oy - L + 1, 1, L);
    }
  }
  if (fill) { ctx.globalAlpha = 0.12 + 0.1 * pulse; ctx.fillStyle = fill; ctx.fillRect(x + 1, y + 1, T - 2, T - 2); }
  ctx.globalAlpha = 1;
}

function render(time) {
  const m = tod();
  ctx.drawImage(BGS[world.room], 0, 0);
  drawWindow(m, time);
  if (held) drawNoPlaceZone();
  const list = [];
  if (COUNTER.room === world.room) list.push({ b: COUNTER.bottom, draw: () => ctx.drawImage(COUNTER.img, COUNTER.x, COUNTER.y) });
  for (const f of furniture) {
    if (f.held || f.room !== world.room) continue;
    const art = FURNITURE_ART[f.type], x = f.tx * T, y = f.ty * T - art.rise;
    const draw = f.type === "cauldron" ? () => drawCauldron(x, y, time) : () => ctx.drawImage(furnitureImage(f), x, y);
    list.push({ b: (f.ty + typeOf(f).h) * T, draw });
  }
  if (!world.inBed) list.push({ b: hero.y, draw: drawHero });
  list.sort((a, b) => a.b - b.b).forEach(o => o.draw());
  const tint = filterAt(m);
  if (tint) { ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H); }
  drawCursor(time);
  if (fade > 0) { ctx.fillStyle = `rgba(18,14,20,${fade.toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); render(now / 1000);
  requestAnimationFrame(frame);
}

// ---------------------------------------------------------------- sizing
const view = document.getElementById("view"), screenEl = document.getElementById("screen");
function fit() {
  const r = view.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const s = Math.min(r.width / W, r.height / H) * dpr;
  // integer device pixels keep every dot the same size; fall back to a fractional scale when that would waste >10% of the space
  const css = (s >= 1 && Math.floor(s) / s >= 0.9 ? Math.floor(s) : s) / dpr;
  screenEl.style.width = W * css + "px"; screenEl.style.height = H * css + "px";
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe(view);

function start(hot) {
  const local = loadLocal();
  const from = hot && hot.v === 1 ? hot : local;
  if (!applySave(from)) { world.clock = realTOD(); lastRealMs = Date.now(); } // new game: day 1 at the current time
  fit();
  requestAnimationFrame(frame);
  connectCloud(from);
}
window.claude?.hot?.snapshot?.(() => serialize());
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? null);
</script>
